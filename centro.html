function brandIcon(url,cb){const im=new Image();im.onload=()=>{try{const mk=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#061A2B';x.fillRect(0,0,n,n);const w=n*.8,h=w*im.naturalHeight/im.naturalWidth,hh=Math.min(h,n*.8),ww=hh*im.naturalWidth/im.naturalHeight;x.drawImage(im,(n-ww)/2,(n-hh)/2,ww,hh);return c.toDataURL('image/png')};cb(mk(512),mk(192),mk(180))}catch(e){}};im.src=url}
function applyBrand(c){
  if(!c)return;const name=c.name||'Centro';ls('cn.brand',{name,logo_url:c.logo_url||''});document.title=name;
  const t=document.querySelector('meta[name=apple-mobile-web-app-title]');if(t)t.content=name;
  if(!c.logo_url)return;
  brandIcon(c.logo_url,(i512,i192,i180)=>{
    const set=(rel,href,sz)=>{document.querySelectorAll('link[rel="'+rel+'"]').forEach(l=>l.remove());const l=document.createElement('link');l.rel=rel;l.href=href;if(sz)l.sizes=sz;document.head.appendChild(l)};
    set('apple-touch-icon',i180,'180x180');set('icon',i192,'192x192');
    try{const base=new URL('./',location.href).href;const m={name,short_name:name.slice(0,12),start_url:base+'centro.html',scope:base,display:'standalone',background_color:'#061A2B',theme_color:'#061A2B',lang:'it',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
      set('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})))}catch(e){}
  });
}

async function loadWx(){if(S.wxBusy||(S.wx&&Date.now()-S.wx.t<18e5))return;S.wxBusy=true;
  try{const q=`latitude=${WX_LAT}&longitude=${WX_LON}&timezone=Europe%2FRome&forecast_days=4`;
    const [a,m]=await Promise.all([fetch(`https://api.open-meteo.com/v1/forecast?${q}&wind_speed_unit=kn&daily=weather_code,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant`).then(r=>r.json()),
      fetch(`https://marine-api.open-meteo.com/v1/marine?${q}&daily=wave_height_max,wave_period_max`).then(r=>r.json())]);
    if(!a.daily)throw 0;S.wx={t:Date.now(),a:a.daily,m:m.daily||null}}catch(e){S.wxErr=true}
  S.wxBusy=false;if(S.stage==='app'&&S.tab==='home'&&!S.cal&&!document.querySelector('.mdl'))render()}
const WXI=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
const DIRS=['N','NE','E','SE','S','SO','O','NO'],dirL=d=>d==null?'':DIRS[Math.round(d/45)%8];
const seaState=h=>h==null?['—','']:h<0.5?['Calmo','g']:h<1?['Poco mosso','g']:h<1.5?['Mosso','w']:h<2.5?['Molto mosso','d']:['Agitato','d'];
function wxFor(key){if(!S.wx)return null;const a=S.wx.a,m=S.wx.m,i=a.time.indexOf(key);if(i<0)return null;return {rain:a.precipitation_sum[i],prob:a.precipitation_probability_max[i],wind:Math.round(a.wind_speed_10m_max[i]),gust:Math.round(a.wind_gusts_10m_max[i]),wdir:a.wind_direction_10m_dominant[i],wave:m?m.wave_height_max[i]:null,code:a.weather_code[i]}}
function wxRisk(w){if(!w)return '';const wv=w.wave||0;return(wv>=1.5||w.wind>=20||w.rain>=10)?'d':(wv>=1||w.wind>=15||w.rain>=3)?'w':'g'}
function wxLine(w){if(!w)return '<span style="color:var(--ink2)">Previsione non ancora disponibile (copre oggi e 3 giorni).</span>';const sl=seaState(w.wave);return `${WXI(w.code)} 🌧 <b>${w.rain}</b> mm (${w.prob??'—'}%) · 💨 <b>${w.wind}</b> nodi ${dirL(w.wdir)}, raff. ${w.gust} · 🌊 <b>${w.wave==null?'—':w.wave.toFixed(1)}</b> m <span class="tg ${sl[1]}">${sl[0]}</span>`}
function stTag(a){if(a.status==='cancelled')return '';if(isSea(a))return a.weather_status==='confirmed'?'<span class="tg g">Confermata</span>':'<span class="tg w">Osservazione meteo</span>';return ''}
function wxStrip(){
  if(!S.wx){loadWx();return `<div class="wk" style="text-align:left;padding:12px 14px"><b style="font-size:14px">Meteo e mare · Stazzo</b><div style="color:var(--ink2);font-size:13px;margin-top:4px">${S.wxErr?'Previsione non disponibile (serve connessione).':'Caricamento…'}</div></div>`}

  if(tomorrow.length)h.push(`<h3 class="th">Da decidere oggi: domani</h3>${tomorrow.map(a=>arow(a,'Conferma in base alla previsione','var(--ph-hold_full)')).join('')}`);

  $('#ac').value=t.capacity;const st=new Date($('#as').value);if(!isNaN(st))$('#ae2').value=dl(new Date(st.getTime()+t.duration_min*6e4));updWx();
  const el=$('#ai'),cur=el.value;el.innerHTML='<option value="">— Da assegnare —</option>'+instrOptions(cur,t.id);const h=$('#ai_h');if(h)h.textContent=el.options.length>1?'':'Nessun istruttore attivo abilitato per questo tipo.'}
function updWx(){const t=S.types.find(x=>x.id===$('#aty').value);const box=$('#awbox');if(!t||!box)return;const sea=isSea({location_type:t.env,kind:t.kind});box.style.display=sea?'block':'none';const st=new Date($('#as').value);const l=$('#wxl');if(sea&&l&&!isNaN(st)){if(!S.wx)loadWx();l.innerHTML=wxLine(wxFor(dkey(st)))}}
function placeSel(cur){const list=S.opts.place.map(x=>x.label);if(cur&&!list.includes(cur))list.push(cur);return `<select id="ap" class="txt" onchange="if(this.value==='__new')newPlace()"><option value="">— Scegli —</option>${list.map(l=>`<option${l===cur?' selected':''}>${esc(l)}</option>`).join('')}<option value="__new">＋ Nuovo luogo…</option></select>`}
async function newPlace(){const n=(prompt('Nome del nuovo luogo:')||'').trim();if(!n){$('#ap').value='';return}
  const {data,error}=await sb.from('activity_options').insert({org_id:S.org.org_id,field:'place',label:n}).select().single();if(error){toast('Non riuscito: '+error.message);$('#ap').value='';return}
  S.opts.place.push(data);S.opts.place.sort((a,b)=>a.label.localeCompare(b.label,'it'));$('#ap').outerHTML=placeSel(n)}
function editAct(id,dayk){
  if(S.demo){toast('Modifica non disponibile nell\'anteprima');return}
  if(!S.types.length){modal(`<div class="top"><h3>Nuova attività</h3><button class="rbtn" onclick="closeModal()">✕</button></div><p>Prima crea almeno un tipo di attività dal PC (pagina Attività della dashboard).</p>`);return}
  const a=id?S.acts.find(x=>x.id===id):null,ty=typeFor(a);S._prevT=ty.id;
  let st=a?new Date(a.starts_at):new Date(Date.now()+864e5);if(!a){if(dayk){const [y,m,d]=dayk.split('-').map(Number);st=new Date(y,m,d)}st.setHours(9,0,0,0)}
  const en=a?new Date(a.ends_at):new Date(st.getTime()+ty.duration_min*6e4);
  modal(`<div class="top"><h3>${a?'Modifica attività':'Nuova attività'}</h3><button class="rbtn" onclick="closeModal()">✕</button></div>
  <label class="f">Tipo di attività</label><select id="aty" class="txt" onchange="typePick()">${S.types.map(t=>`<option value="${t.id}"${t.id===ty.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select>
  <label class="f">Titolo</label><input id="at" class="txt" value="${esc(a?a.title:ty.name)}">
  <label class="f">Luogo</label>${placeSel(a?a.place||'':'')}
  <div class="g2"><div><label class="f">Inizio</label><input id="as" class="txt" type="datetime-local" value="${dl(st)}" onchange="${a?'updWx()':'typePick()'}"></div><div><label class="f">Fine</label><input id="ae2" class="txt" type="datetime-local" value="${dl(en)}"></div></div>
  <div id="awbox" style="display:${isSea({location_type:ty.env,kind:ty.kind})?'block':'none'}"><label class="f">Stato (attività in mare)</label><select id="aw" class="txt"><option value="watch"${!a||a.weather_status!=='confirmed'?' selected':''}>Osservazione meteo</option><option value="confirmed"${a&&a.weather_status==='confirmed'?' selected':''}>Confermata</option></select><div id="wxl" class="note2"></div></div>
  <label class="f">Istruttore (anche dopo)</label><select id="ai" class="txt"><option value="">— Da assegnare —</option>${instrOptions(a?a.instructor_person_id:'',ty.id)}</select><div id="ai_h" style="font-size:12.5px;color:var(--ink2);margin-top:4px"></div>
  <label class="f">Posti</label><input id="ac" class="txt" type="number" min="1" value="${a?a.capacity:ty.capacity}">
  <button class="btn" onclick="saveAct('${id||''}')">Salva</button>`);
  updWx();
}
async function saveAct(id){
  const ty=S.types.find(x=>x.id===$('#aty').value);if(!ty)return toast('Scegli il tipo');const t=$('#at').value.trim();if(!t)return toast('Scrivi un titolo');
  const s=new Date($('#as').value),e=new Date($('#ae2').value);if(isNaN(s)||isNaN(e)||e<=s)return toast('Controlla data e orari');
  const pl=$('#ap').value==='__new'?'':$('#ap').value;
  const rec={type_id:ty.id,kind:ty.kind,location_type:ty.env,title:t,place:pl,starts_at:s.toISOString(),ends_at:e.toISOString(),capacity:+$('#ac').value||1,instructor_person_id:$('#ai').value||null,weather_status:isSea({location_type:ty.env,kind:ty.kind})?$('#aw').value:null};
  const old=id?S.acts.find(x=>x.id===id):null;
  const moved=old&&old.status==='scheduled'&&(old.booked>0||old.waitlist>0)&&(new Date(old.starts_at).getTime()!==s.getTime()||(old.place||'')!==rec.place);
  const {error}=await(id?sb.from('activities').update(rec).eq('id',id):sb.from('activities').insert({...rec,org_id:S.org.org_id,min_rank:0}));
  if(error)return toast('Non riuscito: '+error.message);
  if(moved)await sb.from('activity_notices').insert({org_id:S.org.org_id,activity_id:id,kind:'moved',detail:'Prima: '+fmtDT(old.starts_at)+(old.place?' – '+old.place:'')});
  closeModal();await loadOrg();render();toast('Salvata'+(moved?': ricordati di avvisare gli iscritti':''));
}
async function cancelAct(id){
  const why=prompt('Motivo dell\'annullamento (visibile ai partecipanti):','Condizioni meteo');if(why===null)return;
  if(S.demo){closeModal();toast('Annullata (prova)');return}
  const act=S.acts.find(x=>x.id===id);
  const {error}=await sb.from('activities').update({status:'cancelled',cancel_reason:why}).eq('id',id);
  if(error)return toast('Errore: '+error.message);
  const has=act&&(act.booked>0||act.waitlist>0);
  if(has)await sb.from('activity_notices').insert({org_id:S.org.org_id,activity_id:id,kind:'cancelled',detail:why});
  closeModal();toast('Annullata'+(has?': ricordati di avvisare gli iscritti':''));await loadOrg();render();
}
/* --- Persone: rubrica dal centro --- */
function memView(){
  const q=(S.q||'').toLowerCase(),pt=S.pt||'ath',lf=S.lf||'all';
  const all=S.people.filter(p=>p.role==='athlete'||p.role==='instructor');
  const ath=all.filter(p=>p.role==='athlete'),ist=all.filter(p=>p.role==='instructor');
  const list=(pt==='ath'?ath:ist).filter(p=>(!q||(p.full_name||'').toLowerCase().includes(q))&&(lf==='all'||pt!=='ath'||(lf==='loc'?p.is_local:!p.is_local)));
  const types=p=>S.types.filter(t=>S.links.some(l=>l.person_id===p.id&&l.type_id===t.id)).map(t=>t.name);
  let h=`<div class="top"><h1>Persone</h1>${isAdm()?'<button class="btn sm ghost" onclick="addMember()">+ Accesso app</button>':''}</div>
  <div class="chips2" style="margin:10px 0 4px"><button class="${pt==='ath'?'sel':''}" onclick="S.pt='ath';render()">Atleti <span style="opacity:.7">${ath.length}</span></button><button class="${pt==='ist'?'sel':''}" onclick="S.pt='ist';render()">Istruttori <span style="opacity:.7">${ist.length}</span></button></div>
  ${pt==='ath'?`<div class="chips2" style="margin:6px 0"><button class="${lf==='all'?'sel':''}" onclick="S.lf='all';render()">Tutti</button><button class="${lf==='loc'?'sel':''}" onclick="S.lf='loc';render()">Locali</button><button class="${lf==='non'?'sel':''}" onclick="S.lf='non';render()">Non locali</button></div>`:''}
  <input class="txt" style="margin-top:6px" placeholder="Cerca per nome…" value="${esc(S.q||'')}" oninput="S.q=this.value;const p=this.selectionStart;render();const i=document.querySelector('input.txt');i.focus();i.setSelectionRange(p,p)">`;
  for(const p of list){
    const ty=pt==='ist'?types(p):[];
    h+=`<button class="card" style="--c:${pt==='ist'?'var(--ph-hold_full)':p.is_local?'var(--accent)':'var(--ph-static)'}" onclick="openPerson('${p.id}')"><span class="ic">${pt==='ist'?ICON.diver:ICON.user}</span><span class="sp"><b>${esc(p.full_name)}</b><small>${pt==='ist'?(p.instr_active?'Attivo':'Non attivo')+(ty.length?' · '+esc(ty.join(', ')):''):(p.is_local?'Locale':'Non locale')}${p.user_id?' · app collegata':''}</small></span><span class="chev">›</span></button>`;
  }
  if(!list.length)h+=`<div class="empty">${S.people.length?'Nessuna persona trovata.':'Elenco persone non disponibile per questo accesso.'}</div>`;
  return h+'<p style="font-size:13px;margin-top:14px">Anagrafiche, brevetti e modifiche si gestiscono dalla dashboard sul PC.</p>';
}
function openPerson(pid){
  const p=S.people.find(x=>x.id===pid);if(!p)return;const m=p.user_id&&S.members.find(x=>x.user_id===p.user_id);
  const ph=p.phone?String(p.phone).replace(/\s/g,''):'';
  const nxt=S.acts.filter(a=>a.status==='scheduled'&&new Date(a.ends_at)>=new Date()&&a.instructor_person_id===p.id).slice(0,5);
  modal(`<div class="top"><h3>${esc(p.full_name)}</h3><button class="rbtn" onclick="closeModal()">✕</button></div>
  <div class="tags"><span class="tg">${p.role==='instructor'?'Istruttore':'Atleta'}</span>${p.role==='athlete'?`<span class="tg ${p.is_local?'g':''}">${p.is_local?'Locale':'Non locale'}</span>`:''}${p.user_id?'<span class="tg g">app collegata</span>':''}</div>
  ${ph?`<div style="font-size:15px;margin:12px 0 0">${esc(ph)}</div><div class="g2" style="margin-top:8px"><a class="btn" style="text-decoration:none;margin-top:0" href="tel:${esc(ph)}">Chiama</a><a class="btn ghost" style="text-decoration:none;margin-top:0" target="_blank" rel="noopener" href="https://wa.me/${ph.replace(/\D/g,'')}">WhatsApp</a></div>`:'<p style="margin-top:12px">Nessun telefono registrato.</p>'}
  ${nxt.length?`<h2 style="font-size:15px;margin:16px 0 0">Prossime attività</h2>${nxt.map(a=>`<div class="row"><div class="lbl">${esc(a.title)}<small>${fmtD(a.starts_at)} · ${fmtT(a.starts_at)}</small></div></div>`).join('')}`:''}
  ${m?`<button class="btn ghost" onclick="openMember('${p.user_id}')">Livello e accesso nell'app</button>`:''}`);
}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(new URLSearchParams(location.search).has('demo'))startDemo();else init();
</script>
