<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathing Coach">
<meta name="theme-color" content="#061A2B">
<title>Breathing Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#061A2B; --bg2:#0B2A40; --ink:#EAF4F7; --ink2:#8FB1C2; --line:rgba(234,244,247,.14);
  --accent:#8FE0D2; --danger:#F08A7A;
  --ph-inhale:#8FE0D2; --ph-hold_full:#F2C879; --ph-exhale:#7FB4F0; --ph-hold_empty:#C4A6EA; --ph-warm:#A9D3B5; --ph-static:#79C9F2;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column;padding:20px 20px 28px;max-width:520px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:22px;font-weight:600;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
p{line-height:1.55;margin:0 0 12px;color:var(--ink2);font-size:15px}
p.lead{color:var(--ink);font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.pill.acc{color:var(--accent);border-color:rgba(143,224,210,.4)}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:600;text-align:center;background:var(--accent);color:#04131D;margin-top:10px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row .lbl{font-size:15px}
.row .lbl small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.grp{border-left:3px solid var(--c);padding-left:14px;margin-top:6px}
.grp h2{color:var(--c);margin-top:6px}
#s-pb,#s-pb-add{}.pbcard{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:10px;width:100%;text-align:left;display:block}
.pbcard .pbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.pbcard .pbv{font-size:26px;font-weight:700;letter-spacing:-.01em}.pbcard .pbn{font-weight:600}.pbcard small{color:var(--ink2);font-size:12px;display:block}.pbcard .pbn small{display:inline}
.pbgrp{display:flex;align-items:center;gap:8px;margin:22px 0 2px;color:var(--c);font-weight:600;font-size:15px}.pbgrp .ic svg{width:22px;height:22px}
.pbempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin:28px 0}.pbempty img{width:110px;height:auto;border-radius:20px}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips2 button{border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:var(--ink2);font-size:14px}.chips2 button.sel{background:var(--c,var(--acc));color:#062A2A;border-color:transparent;font-weight:600}
.pbin{display:flex;gap:8px;align-items:center;margin:8px 0}.pbin input{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font-size:20px;width:90px;text-align:center}.pbin input[type=date]{width:auto;font-size:16px}
.warmcard{display:flex;flex-direction:column;gap:2px;padding:10px 0 6px;font-size:15px}.warmcard span{font-size:13px;color:var(--ink2)}.grp-warm{--c:var(--ph-warm)}.grp-main{--c:var(--ph-hold_full)}.grp-static{--c:var(--ph-static)}
#s-static-run{padding:0;transition:background .9s ease}
#s-static-run{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;padding:0}
#s-static-run .sess{height:100%;min-height:0;padding:10px 20px 10px;cursor:pointer;justify-content:space-between}
#s-static-run .phase{font-size:22px;min-height:0}
#s-static-run .num{font-size:min(28vw,130px);margin:0}
#s-static-run .btn{padding:12px;font-size:16px}
.card{background:color-mix(in srgb,var(--c) 13%,var(--bg2));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:16px;padding:16px 14px;margin-top:10px;border-left:4px solid var(--c)}
.card .ic{width:40px;height:40px;flex-shrink:0;color:var(--c)}
.card .ic svg{width:40px;height:40px}
.card b{display:block;font-size:17px;font-weight:600}
.card small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.card .chev{margin-left:auto;font-size:26px;color:var(--ink2)}
.card:active{transform:scale(.985)}
.mute svg{width:22px;height:22px}
.tab svg{width:22px;height:22px;stroke:currentColor}
#s-welcome,#s-home,#s-static,#s-pb{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(6,26,43,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.mdl{position:fixed;inset:0;background:rgba(3,12,20,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mdl.on{display:flex}
.mdl .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px 20px;max-width:360px;width:100%}
.mdl h3{margin:0 0 12px;font-size:20px}
.mdl ul{margin:0 0 14px;padding-left:20px;line-height:1.5;color:var(--ink)}
.mdl label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2);margin:0 0 16px}
.mdl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.tabs:has(.legal){flex-direction:column}
.tabrow{display:flex;width:100%}
.tabs:has(.legal){padding-bottom:0}
.legal{display:flex;justify-content:center;gap:26px;margin-top:14px;padding:0 0 max(8px,calc(env(safe-area-inset-bottom,0px) - 6px))}
.legal .link{font-size:11.5px;color:var(--ink2);opacity:.65}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;color:var(--ink2)}
.tab .ic{height:22px;display:flex;color:var(--c,var(--ink2))}
.tab.sel{color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.chart{width:100%;height:auto;display:block;background:var(--bg2);border-radius:12px;padding:8px}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink2)}
.mute{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.sess .mute{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border-color:rgba(4,19,29,.35)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px;line-height:1}
.stepper .v{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.stepper .v small{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--ink)}
.sum{font-size:14px;color:var(--ink2);margin:6px 0 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.chips button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px}
.chips button.sel{border-color:var(--accent);background:rgba(143,224,210,.12);color:var(--accent)}
input.txt{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:17px}
input.code{letter-spacing:8px;text-align:center;font-size:28px;font-weight:600}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:8px 0}
.ok{color:var(--accent)}
/* session */
#s-session{padding:0;transition:background .9s ease}
.sess{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 24px;text-align:center;min-height:100%}
.sess .phase{font-size:26px;font-weight:600;letter-spacing:-.01em;min-height:36px}
.sess .lungs{font-size:15px;opacity:.85;min-height:22px;margin-top:6px}
.sess .num{font-size:min(44vw,200px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:8px 0}
.sess .meta{display:flex;gap:28px;font-size:15px;opacity:.85;font-variant-numeric:tabular-nums}
.sess .meta b{display:block;font-size:22px;font-weight:600}
.sess .btn{max-width:360px}
.bar{height:4px;width:100%;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:rgba(255,255,255,.9);width:0%;transition:width .25s linear}
.dark .sess{color:#04131D}
.dark .bar{background:rgba(0,0,0,.15)}
.dark .bar i{background:rgba(4,19,29,.85)}
/* feedback */
.fb{display:flex;gap:10px;margin:6px 0 14px}
.fb button{flex:1;padding:16px 6px;border-radius:14px;border:1px solid var(--line);font-size:15px}
.fb button span{display:block;font-size:30px;margin-bottom:6px}
.fb button.sel{border-color:var(--accent);background:rgba(143,224,210,.12)}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:12px;resize:vertical}
/* diag */
pre{background:#031019;color:#BFD6E0;font-size:11.5px;line-height:1.45;padding:12px;border-radius:12px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.hist{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink2);display:flex;gap:10px;align-items:flex-start}
.hist .ht{flex:1}
.hist .del{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.hist .del:active{color:var(--danger);border-color:var(--danger)}
.hist b{color:var(--ink);font-weight:600}
.link{color:var(--accent);text-decoration:underline;background:none;padding:0;font-size:14px}
.tiny{font-size:12.5px;color:var(--ink2)}
.stats{display:flex;gap:10px;margin:8px 0 4px}
.stats div{flex:1;background:var(--bg2);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:600}
.stats span{font-size:12px;color:var(--ink2)}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}.rbtn svg{width:22px;height:22px}
.pbcard .pbv{white-space:nowrap}
.wtabs{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wk{display:block;width:100%;background:var(--bg2);border-radius:16px;padding:14px 8px 12px;margin:12px 0 4px;text-align:center}
.wkg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.wkd.today{color:var(--ink);font-weight:700}
.dr{width:34px;height:34px;border-radius:50%;padding:3px;display:flex;flex-shrink:0}
.dr>i{flex:1;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:var(--ink)}
.dr>i svg{width:16px;height:16px}
.dr.e{padding:0;border:1.5px solid var(--line)}.dr.e>i{background:none;color:var(--ink2);font-weight:400}
.dr.fut{opacity:.4}
.wkd.today .dr.e{border-color:var(--ink2)}
.wkl{font-size:13px;color:var(--ink2);margin-top:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}.calh b{font-size:17px;text-transform:capitalize}
.calh button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;justify-items:center}
.calg .wd{font-size:11px;color:var(--ink2)}
.cd{display:flex;flex-direction:column;align-items:center;position:relative;width:100%}
.cd .dr{width:38px;height:38px;padding:3px}.cd .dr.e{padding:0}
.cd.sel .dr{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.cd .st{position:absolute;top:-3px;right:calc(50% - 25px);color:var(--ph-inhale);font-size:11px;line-height:1}
.cd .st svg{width:12px;height:12px;fill:currentColor}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:14px 0 4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dayrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}.dayrow b{color:var(--ink)}.dayrow i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hist.tap{cursor:pointer}
.hist .del,.hist .ed{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0}
.hist .del svg,.hist .ed svg{width:18px;height:18px}
.hist .ed:active{color:var(--accent);border-color:var(--accent)}
.pbcard .chv{color:var(--ink2);font-size:22px;margin-left:8px}
.startbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-top:12px;background:linear-gradient(rgba(6,26,43,0),var(--bg) 28%)}
#s-home .row{padding:9px 0}#s-home h2{margin-top:4px}
#s-home .grp{margin-top:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;font-size:14px;z-index:50}
.btn.sm{padding:12px;font-size:15px}
@media (prefers-reduced-motion:reduce){#s-session{transition:none}.bar i{transition:none}}
</style>
</head>
<body>

<!-- ===== DISCLAIMER + CONSENSO ===== -->
<section class="screen" id="s-disclaimer">
  <h1 data-i18n="dis_title"></h1>
  <p class="lead" data-i18n="dis_1"></p>
  <p data-i18n="dis_2"></p>
  <p data-i18n="dis_3"></p>
  <p data-i18n="dis_4"></p>
  <p class="tiny" data-i18n="dis_5"></p>
  <div style="flex:1"></div>
  <button class="btn" id="b-accept" data-i18n="dis_accept"></button>
  <p class="tiny" style="text-align:center;margin-top:14px"><button class="link" id="b-have-account" data-i18n="have_account"></button></p>
</section>

<!-- ===== ONBOARDING ===== -->
<section class="screen" id="s-onb">
  <h1 data-i18n="onb_title"></h1>
  <p data-i18n="onb_sub"></p>
  <h2 data-i18n="onb_name"></h2>
  <input class="txt" id="onb-name" autocomplete="given-name">
  <h2 data-i18n="onb_level"></h2>
  <div class="chips" id="onb-level">
    <button data-v="beginner" data-i18n="lv_beginner"></button>
    <button data-v="intermediate" data-i18n="lv_intermediate"></button>
    <button data-v="advanced" data-i18n="lv_advanced"></button>
  </div>
  <h2 data-i18n="onb_goal"></h2>
  <div class="chips" id="onb-goal">
    <button data-v="relax" data-i18n="goal_relax"></button>
    <button data-v="equalization" data-i18n="goal_eq"></button>
    <button data-v="performance" data-i18n="goal_perf"></button>
  </div>
  <h2 data-i18n="onb_weekly"></h2>
  <div class="row" style="border:0"><div class="lbl" data-i18n="onb_weekly_l"></div><div class="stepper" id="onb-weekly"></div></div>
  <div style="flex:1"></div>
  <button class="btn" id="b-onb-done" data-i18n="onb_done"></button>
  <p class="tiny" style="text-align:center;margin-top:14px"><button class="link" id="b-have-account2" data-i18n="have_account"></button></p>
</section>

<!-- ===== WELCOME ===== -->
<section class="screen" id="s-welcome">
  <div class="top">
    <h1 id="wl-hi"></h1>
    <div style="display:flex;gap:8px;align-items:center"><button class="pill" id="b-lang2">EN</button><button class="rbtn" id="b-share" aria-label="share" style="width:40px;height:40px"></button><button class="rbtn" id="b-acc-ic" aria-label="account" style="width:40px;height:40px"></button></div>
  </div>
  <div style="margin:10px 0 0"><button class="pill acc" id="b-account3" style="width:100%;text-align:left;display:none"></button></div>
  <button class="wk" id="wk"><div class="wkg" id="wk-grid"></div><div class="wkl" id="wk-line"></div></button>
  <h2 data-i18n="wl_q"></h2>
  <button class="card" id="wl-breath" style="--c:var(--ph-hold_full)"><span class="ic" data-ic="lungs"></span><span><b data-i18n="wl_breath"></b><small id="wl-breath-sub"></small></span><span class="chev">›</span></button>
  <button class="card" id="wl-static" style="--c:var(--ph-static)"><span class="ic" data-ic="timer"></span><span><b data-i18n="wl_static"></b><small id="wl-static-sub"></small></span><span class="chev">›</span></button>
  <button class="card" id="wl-water" style="--c:var(--ph-exhale)"><span class="ic" data-ic="sea"></span><span><b data-i18n="wl_water"></b><small id="wl-water-sub"></small></span><span class="chev">›</span></button>
  <button class="card" id="wl-pb" style="--c:var(--ph-inhale)"><span class="ic" data-ic="trophy"></span><span><b data-i18n="wl_pb"></b><small id="wl-pb-sub"></small></span><span class="chev">›</span></button>
  <nav class="tabs" data-tabs><div class="tabrow" data-tabrow></div>
    <div class="legal">
      <button class="link" id="b-history" data-i18n="history"></button>
      <button class="link" id="b-diag" data-i18n="diag"></button>
      <a class="link" href="privacy.html" data-i18n="privacy"></a>
      <a class="link" href="about.html" data-i18n="info"></a>
    </div>
  </nav>
</section>

<!-- ===== HOME / SETTINGS ===== -->
<section class="screen" id="s-home">
  <div class="top">
    <div>
      <h1 data-i18n="tab_breath"></h1>
      <div class="sum" id="proto-name"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><button class="mute" id="b-mute-home"></button><button class="rbtn" id="b-tip" aria-label="info" style="font-size:19px;font-weight:600;font-style:italic;font-family:Georgia,serif">i</button></div>
  </div>
  <button class="pill" id="b-lang" style="display:none">EN</button><button class="pill" id="b-account" style="display:none"></button>
  <div class="note" id="tipbox" style="display:none;margin-top:10px"></div>

  <div class="grp grp-warm">
    <div class="top" style="align-items:center"><h2 data-i18n="set_warm"></h2><button class="pill" id="b-warm-edit" style="display:inline-flex;gap:6px;align-items:center"></button></div>

const PROTOCOL={
  id:'breathing-4phase-training', exerciseId:'breathing', nameKey:'proto', schemaVersion:SCHEMA,
  params:{warmIn:6,warmOut:6,warmReps:5,inhale:10,holdFull:20,exhale:10,holdEmpty:10,cycles:6},
  limits:{warmIn:[2,20,1],warmOut:[2,20,1],warmReps:[0,10,1],inhale:[2,60,1],holdFull:[0,600,5],exhale:[2,60,1],holdEmpty:[0,300,5],cycles:[1,30,1]},
  blocks:[
    {kind:'warmup',repeat:'warmReps',phases:[
      {type:'inhale',duration:{param:'warmIn'},cue:'inhale'},
      {type:'exhale',duration:{param:'warmOut'},cue:'exhale'}]},
    {kind:'main',repeat:'cycles',phases:[
      {type:'inhale',duration:{param:'inhale'},cue:'inhale'},
      {type:'hold_full',duration:{param:'holdFull'},cue:'hold_full'},
      {type:'exhale',duration:{param:'exhale'},cue:'exhale'},
      {type:'hold_empty',duration:{param:'holdEmpty'},cue:'hold_empty'}]}
  ]
};
let params=Object.assign({},PROTOCOL.params,lsJ(KEY.cfg,{}));
const WARM_KEYS=['warmIn','warmOut','warmReps'];
function warmDefault(){const o={};WARM_KEYS.forEach(k=>o[k]=PROTOCOL.params[k]);return o}
function warmMine(){const m=lsJ(KEY.warm,null);return m&&WARM_KEYS.every(k=>typeof m[k]==='number')?m:null}
function warmBase(){return warmMine()||warmDefault()}
Object.assign(params,warmBase());

function buildTimeline(p){
  const segs=[];let tt=0;const LEAD=2;
  tt+=LEAD;
  for(const b of PROTOCOL.blocks){
    const reps=p[b.repeat];
    for(let r=1;r<=reps;r++){
      for(const ph of b.phases){
        const d=p[ph.duration.param];if(d<=0)continue;
        segs.push({block:b.kind,type:ph.type,cue:ph.cue,rep:r,reps,start:tt,end:tt+d});
        tt+=d;
      }
    }
  }
  return {segs,total:tt};
}

/* ---------- audio: sintesi in puro JS a 44.1 kHz ---------- */
const SR=44100;
function toneSamples(f0,f1,dur,gain=.6,type='sine'){
  const n=Math.round(dur*SR),out=new Float32Array(n);let ph=0;const A=.02,R=.06,k=Math.log(f1/f0);
  for(let i=0;i<n;i++){const t=i/SR;const f=f1===f0?f0:f0*Math.exp(k*t/dur);ph+=2*Math.PI*f/SR;
    const env=t<A?t/A:(t>dur-R?Math.max(0,(dur-t)/R):1);
    const x=type==='triangle'?(2/Math.PI)*Math.asin(Math.sin(ph)):Math.sin(ph);out[i]=gain*env*x}
  return out;
}
function mix(track,t0,samples){let o=Math.round(t0*SR);const n=Math.min(samples.length,track.length-o);for(let i=0;i<n;i++)track[o+i]+=samples[i]}
const tone=(tr,t,f0,f1,d,g,ty)=>mix(tr,t,toneSamples(f0,f1,d,g,ty));
const CUES={
  inhale:(tr,t)=>tone(tr,t,392,784,.7),
  exhale:(tr,t)=>tone(tr,t,784,392,.7),
  hold_full:(tr,t)=>{tone(tr,t,880,880,.18);tone(tr,t+.26,880,880,.18)},
  hold_empty:(tr,t)=>tone(tr,t,262,262,.5,.7,'triangle'),
  last:(tr,t)=>{for(let i=0;i<3;i++)tone(tr,t+i*.22,1047,1047,.12,.5)},
  end:(tr,t)=>{tone(tr,t,523,523,1.2,.4);tone(tr,t,659,659,1.2,.35);tone(tr,t,784,784,1.2,.3)},
};
function renderCues(totalSec,fn){const track=new Float32Array(Math.ceil(totalSec*SR));fn(track);return URL.createObjectURL(wavBlob(track))}
async function renderTrack(tl){
  await new Promise(r=>setTimeout(r,0));
  return renderCues(tl.total+3,track=>{
    for(const s of tl.segs){
      if(s.block==='warmup'){ if(s.type==='inhale') CUES.inhale(track,s.start); else CUES.exhale(track,s.start); }
      else{ CUES[s.cue](track,s.start); if(s.type==='inhale'&&s.rep===s.reps&&s.reps>1) CUES.last(track,s.start+1.0); }
    }
    CUES.end(track,tl.total);
  });
}
function wavBlob(ch){
  const n=ch.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let pk=0;for(let i=0;i<n;i++){const a=Math.abs(ch[i]);if(a>pk)pk=a}const k=pk>0?Math.min(1,.85/pk):1;
  const out=new Int16Array(ab,44,n);for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,ch[i]*k));out[i]=s<0?s*32768:s*32767}
  return new Blob([ab],{type:'audio/wav'});
}
function silenceWav(sec){const n=Math.round(SR*sec),ab=new ArrayBuffer(44+n*2),v=new DataView(ab);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}))}
const SILENCE=silenceWav(0.3);

/* ---------- wake lock ---------- */
let wake=null;
async function acquireWake(){try{if(!('wakeLock'in navigator))return log('wake','unsupported');wake=await navigator.wakeLock.request('screen');log('wake','acquired');wake.addEventListener('release',()=>log('wake','released'))}catch(e){log('wake-error',e.message)}}
async function releaseWake(){try{if(wake){await wake.release();wake=null}}catch(e){}}

const sb=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let user=null;        // auth user corrente (anonimo o registrato)
let loginKey=null;    // evita doppio afterLogin
let profile=lsJ(KEY.onb,null);

async function ensureUser(){
  if(!sb)return null;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){user=session.user;if(!user.is_anonymous)loginKey=user.id+':u';log('auth:session',{id:user.id.slice(0,8),anon:!!user.is_anonymous});return user}
    if(!navigator.onLine)return null;
    const {data,error}=await sb.auth.signInAnonymously();
    if(error)throw error;
    user=data.user;log('auth:anonymous',{id:user.id.slice(0,8)});
    track('first_open');
    return user;
  }catch(e){log('auth:error',e.message);return null}
}
function isGuest(){return !user||!!user.is_anonymous}
function userLabel(){if(!user||user.is_anonymous)return null;return (profile&&profile.display_name)||user.user_metadata?.full_name||user.user_metadata?.name||user.email||'—'}

/* --- profilo --- */
async function saveProfile(p){
  profile=Object.assign({},profile||{},p);lsSet(KEY.onb,JSON.stringify(profile));
  if(!sb||!user)return;
  try{
    const row={user_id:user.id,display_name:profile.display_name||null,level:profile.level||null,goal:profile.goal||null,weekly_target:profile.weekly_target||3,locale:lang,
      consent_privacy_version:profile.consent_version||PRIVACY_VERSION,consent_at:profile.consent_at||new Date().toISOString(),onboarding_done:!!profile.onboarding_done,updated_at:new Date().toISOString()};
    const {error}=await sb.from('profiles').upsert(row,{onConflict:'user_id'});
    if(error)throw error;log('profile:saved');
  }catch(e){log('profile:error',e.message)}
}
async function pullProfile(){
  if(!sb||!user||user.is_anonymous)return;
  try{
    const {data,error}=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();
    if(error)throw error;if(!data)return;
    profile=Object.assign({},profile||{},{
      display_name:data.display_name||profile?.display_name||'',level:data.level||profile?.level||null,goal:data.goal||profile?.goal||null,
      weekly_target:data.weekly_target||profile?.weekly_target||3,onboarding_done:!!(data.onboarding_done||profile?.onboarding_done||(data.display_name&&data.level)),
      consent_version:data.consent_privacy_version||profile?.consent_version,consent_at:data.consent_at||profile?.consent_at});
    lsSet(KEY.onb,JSON.stringify(profile));log('profile:pulled',{onb:profile.onboarding_done});
  }catch(e){log('profile:pull-error',e.message)}
}
async function pushPrefs(){
  if(!sb||!user||user.is_anonymous)return;
  try{const blob={t:+ls('bc.prefs.ts')||Date.now(),cfg:lsJ('bc.params.v1',null),warm:lsJ('bc.warm.v1',null),st:lsJ('bc.static.v1',null)};
    const {error}=await sb.auth.updateUser({data:{prefs:blob}});if(error)throw error;log('prefs:pushed')}catch(e){log('prefs:push-error',e.message)}
}
function pullPrefs(){
  if(!user||user.is_anonymous)return;
  try{const b=user.user_metadata&&user.user_metadata.prefs;if(!b)return pushPrefs();
    const lt=+ls('bc.prefs.ts')||0;if(b.t<=lt)return;

async function registerDevice(){
  if(!sb||!user)return;
  try{const e=env();await sb.from('devices').upsert({id:deviceId,user_id:user.id,ua:e.ua.slice(0,200),platform:isIOS?'ios':/Android/.test(e.ua)?'android':'other',standalone:e.standalone,last_seen:new Date().toISOString()},{onConflict:'id'})}catch(e){log('device:error',e.message)}

/* --- eventi (coda locale, flush quando possibile) --- */
function track(event,props){
  const q=lsJ(KEY.events,[]);q.push({event,props:props||{},ts:new Date().toISOString(),device_id:deviceId,app_version:VERSION});
  if(q.length>500)q.splice(0,q.length-500);lsSet(KEY.events,JSON.stringify(q));
  flushEvents();
}
let flushing=false;
async function flushEvents(){
  if(flushing||!sb||!user||!navigator.onLine)return;
  const q=lsJ(KEY.events,[]);if(!q.length)return;flushing=true;
  try{
    const rows=q.map(e=>({user_id:user.id,device_id:e.device_id,event:e.event,props:e.props,app_version:e.app_version,ts:e.ts}));
    const {error}=await sb.from('events').insert(rows);
    if(error)throw error;
    const rest=lsJ(KEY.events,[]).slice(q.length);lsSet(KEY.events,JSON.stringify(rest));log('events:flushed',q.length);
  }catch(e){log('events:error',e.message)}finally{flushing=false}
}

/* --- sessioni: locale → cloud --- */
function toRow(r){return {id:r.id,user_id:user.id,device_id:deviceId,protocol_id:r.protocolId,exercise_id:r.exerciseId,schema_version:r.schemaVersion||SCHEMA,
  started_at:r.startedAt,ended_at:r.endedAt,status:r.status,abort_reason:r.abortReason,planned_params:r.plannedParams,actual_params:r.actualParams,
  cycles_completed:r.cyclesCompleted,elapsed_sec:r.elapsedSec,planned_sec:r.plannedSec,feedback:r.feedback,notes:r.notes,next_params:r.nextParams,diag:r.diag}}
function fromRow(x){return {id:x.id,schemaVersion:x.schema_version,protocolId:x.protocol_id,exerciseId:x.exercise_id,startedAt:x.started_at,endedAt:x.ended_at,status:x.status,abortReason:x.abort_reason,
  plannedParams:x.planned_params,actualParams:x.actual_params,cyclesCompleted:x.cycles_completed,elapsedSec:x.elapsed_sec,plannedSec:x.planned_sec,feedback:x.feedback,notes:x.notes,nextParams:x.next_params,diag:x.diag,synced:true,owner:x.user_id}}
let syncing=false;
async function pushSessions(){
  if(syncing||!sb||!user||!navigator.onLine)return;
  const all=lsJ(KEY.sess,[]);const pend=all.filter(r=>!r.synced&&(!r.owner||r.owner===user.id));
  if(!pend.length)return;syncing=true;
  try{
    const {error}=await sb.from('sessions').upsert(pend.map(toRow),{onConflict:'id'});
    if(error)throw error;
    const ids=new Set(pend.map(r=>r.id));all.forEach(r=>{if(ids.has(r.id)){r.synced=true;r.owner=user.id}});lsSet(KEY.sess,JSON.stringify(all));
    log('sessions:pushed',pend.length);
  }catch(e){log('sessions:push-error',e.message)}finally{syncing=false;renderAccountPill()}
}
async function pullSessions(){
  if(!sb||!user||!navigator.onLine)return;
  try{
    const {data,error}=await sb.from('sessions').select('*').order('started_at',{ascending:true}).limit(1000);
    if(error)throw error;
    const all=lsJ(KEY.sess,[]);const byId=new Map(all.map(r=>[r.id,r]));
    const pendDel=new Set(lsJ(KEY_DEL,[]));
    let added=0;for(const x of data){if(pendDel.has(x.id))continue;if(!byId.has(x.id)){all.push(fromRow(x));added++}else{byId.get(x.id).synced=true;byId.get(x.id).owner=x.user_id}}
    all.sort((a,b)=>a.startedAt<b.startedAt?-1:1);lsSet(KEY.sess,JSON.stringify(all));log('sessions:pulled',{total:data.length,added});
  }catch(e){log('sessions:pull-error',e.message)}
}
/* --- eliminazione sessioni (locale + cloud, con coda se offline) --- */
const KEY_DEL='bc.deleted.v1';
async function deleteSession(id){
  const all=lsJ(KEY.sess,[]);const rec=all.find(r=>r.id===id);
  lsSet(KEY.sess,JSON.stringify(all.filter(r=>r.id!==id)));
  const q=lsJ(KEY_DEL,[]);if(rec&&rec.synced&&!q.includes(id)){q.push(id);lsSet(KEY_DEL,JSON.stringify(q))}
  track('session_delete',{exercise:rec?rec.exerciseId:null});log('session:deleted',id);
  await flushDeletes();
}
let deleting=false;
async function flushDeletes(){
  if(deleting||!sb||!user||!navigator.onLine)return;
  const q=lsJ(KEY_DEL,[]);if(!q.length)return;deleting=true;
  try{const {error}=await sb.from('sessions').delete().in('id',q);if(error)throw error;lsSet(KEY_DEL,'[]');log('sessions:deleted-cloud',q.length)}
  catch(e){log('sessions:delete-error',e.message)}finally{deleting=false}
}
async function syncAll(){await flushEvents();await flushDeletes();await pushSessions()}
function bindDeletes(container,after){
  container.querySelectorAll('.del').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm(t('del_confirm')))return;await deleteSession(b.dataset.id);after()});
}
window.addEventListener('online',syncAll);

/* --- login / account --- */
let accMode='new'; // new = ospite che crea l'account | existing = accedo a un account già esistente
let pendingEmail=null;
function accErr(k){$('acc-err').textContent=k?t(k):''}
async function sendCode(){
  const email=$('acc-email').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return accErr('err_email');
  if(!navigator.onLine)return accErr('err_offline');
  accErr('');$('b-send-code').disabled=true;
  try{
    let error;
    if(accMode==='new'&&isGuest()&&user){({error}=await sb.auth.updateUser({email}));pendingType='email_change'}
    else{({error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}));pendingType='email'}
    if(error)throw error;
    pendingEmail=email;$('acc-sent-to').textContent=T[lang].acc_sent(email);
    $('acc-step-email').style.display='none';$('acc-step-code').style.display='block';setTimeout(()=>$('acc-code').focus(),50);
    track('login_code_sent',{mode:accMode});
  }catch(e){log('auth:otp-error',e.message);
    if(/already|registered|exists/i.test(e.message)){accMode='existing';renderAccMode();return sendCode()}
    accErr('err_generic');$('acc-err').textContent+=' ('+e.message+')'}
  finally{$('b-send-code').disabled=false}
}
let pendingType='email';
async function verifyCode(){
  const token=$('acc-code').value.replace(/\D/g,'');
  if(token.length!==6)return accErr('err_code');
  accErr('');$('b-verify').disabled=true;
  try{
    const {data,error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:pendingType});
    if(error)throw error;
    user=data.user||(await sb.auth.getUser()).data.user;
    await afterLogin('email');
  }catch(e){log('auth:verify-error',e.message);accErr('err_code')}
  finally{$('b-verify').disabled=false}
}
async function googleLogin(){
  if(!navigator.onLine)return accErr('err_offline');
  const redirectTo=location.origin+location.pathname;
  try{
    track('login_google_start',{guest:isGuest()});
    if(isGuest()&&user&&accMode==='new'){
      const {error}=await sb.auth.linkIdentity({provider:'google',options:{redirectTo}});
      if(error){log('auth:link-error',error.message);await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}})}
    }else{
      const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});if(error)throw error;
    }
  }catch(e){log('auth:google-error',e.message);accErr('err_generic')}
}
async function afterLogin(method){
  const key=user.id+':'+(user.is_anonymous?'a':'u');if(loginKey===key)return;loginKey=key;
  log('auth:login',{method,id:user.id.slice(0,8)});
  track('login_success',{method});
  await pullProfile();pullPrefs();
  if(profile&&!profile.display_name&&(user.user_metadata?.full_name||user.user_metadata?.name))profile.display_name=user.user_metadata.full_name||user.user_metadata.name;
  if(profile&&profile.display_name&&profile.level)profile.onboarding_done=true;
  await saveProfile(profile||{});
  await registerDevice();
  await pullSessions();await pushSessions();await flushEvents();
  renderAccountPill();renderAccount();
  if(!profile||!profile.onboarding_done){renderOnb();show('s-onb')}else goTab('s-welcome');
}
// "Ho già un account": consenso accettato, nessun utente anonimo, vai subito al login
function haveAccount(){
  if(!ls(KEY.acc)){lsSet(KEY.acc,new Date().toISOString());profile=Object.assign({},profile||{},{consent_version:PRIVACY_VERSION,consent_at:new Date().toISOString()});lsSet(KEY.onb,JSON.stringify(profile));track('consent_accepted',{version:PRIVACY_VERSION,via:'have_account'})}
  openAccount(false);accMode='existing';renderAccMode();
}
async function logout(){
  track('logout');await flushEvents();
  try{await sb.auth.signOut()}catch(e){}
  user=null;lsSet(KEY.sess,JSON.stringify(lsJ(KEY.sess,[]).filter(r=>!r.synced)));

/* ---------- session engine ---------- */
let run=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

async function startSession(){
  $('b-start').disabled=true;
  const tl=buildTimeline(params);
  run={tl,plannedParams:{...params},id:uuid(),startedAt:new Date().toISOString(),lastSeg:-1,url:null,phaseMarks:[]};
  log('session:start',{id:run.id,total:tl.total,params});
  track('session_start',{total:tl.total,params});
  audio.loop=false;audio.onended=null;
  try{audio.src=SILENCE;await withTimeout(audio.play(),1500,'unlock');log('audio:unlocked')}catch(e){log('audio:unlock-failed',e.message)}
  show('s-session');setPhaseUI(null);$('ph').textContent=t('preparing');
  const t0=performance.now();
  try{run.url=await withTimeout(renderTrack(tl),20000,'render');log('track:rendered',{ms:Math.round(performance.now()-t0),sec:tl.total})}
  catch(e){log('track:error',e.message);return abort('render-error')}
  audio.src=run.url;
  try{await withTimeout(audio.play(),5000,'play');run.wallStart=Date.now();log('audio:started')}catch(e){log('audio:play-failed',e.message);return abort('play-error')}
  acquireWake();
  if('mediaSession'in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Breathing Coach',artist:t('set_main')});navigator.mediaSession.setActionHandler('pause',()=>{audio.play()});}catch(e){}}
  audio.onended=()=>finish(false);
  tick();
}
function tick(){
  if(!run)return;
  const ct=audio.currentTime,tl=run.tl;
  let idx=tl.segs.findIndex(s=>ct>=s.start&&ct<s.end);
  if(idx!==run.lastSeg){
    run.lastSeg=idx;const s=tl.segs[idx];
    if(s){const wall=(Date.now()-run.wallStart)/1000;const drift=Math.round((wall-ct)*1000);run.phaseMarks.push(drift);log('phase',{b:s.block,t:s.type,rep:s.rep,ct:Math.round(ct*10)/10,driftMs:drift})}
    setPhaseUI(s);
  }
  const s=tl.segs[idx];
  if(s){$('num').textContent=Math.ceil(s.end-ct);$('bar').style.width=((ct-s.start)/(s.end-s.start)*100).toFixed(1)+'%'}
  else if(ct>=tl.total){$('num').textContent='✓'}
  else{$('num').textContent=Math.ceil((tl.segs[0]?.start||0)-ct)}
  {const cur=s;let rem=tl.total-ct,lab=t('left');
    if(cur&&cur.block==='warmup'){const we=Math.max(...tl.segs.filter(x=>x.block==='warmup').map(x=>x.end));rem=we-ct;lab=t('left_warm')}
    $('m-left').textContent=t2(Math.max(0,rem));if(run.leftLab!==lab){run.leftLab=lab;$('m-left-l').textContent=lab}}
  run.raf=requestAnimationFrame(tick);
}
function setPhaseUI(s){
  const root=$('s-session');
  if(!s){root.style.background='var(--bg)';root.classList.remove('dark');$('ph').textContent='';$('lg').textContent='';$('tipx').textContent='';$('m-cycle').textContent='–';$('m-cycle-l').textContent=t('cycle');$('m-left-l').textContent=t('left');return}
  const col=s.block==='warmup'?'var(--ph-warm)':`var(--ph-${s.type})`;
  root.style.background=col;root.classList.add('dark');
  $('ph').textContent=(s.block==='warmup'?t('warm')+' · ':'')+t(s.type);
  $('lg').textContent=s.type==='hold_full'?t('lungs_full'):s.type==='hold_empty'?t('lungs_empty'):'';
  {const hl=s.type==='hold_full'||s.type==='hold_empty';const tp=T[lang].tips;$('tipx').textContent=hl&&s.block==='main'?tp[(s.rep*2+(s.type==='hold_empty'?1:0))%tp.length]:''}
  $('m-cycle').textContent=`${s.rep}/${s.reps}`;
  $('m-cycle-l').textContent=s.block==='warmup'?t('warm'):(s.rep===s.reps&&s.reps>1?t('last'):t('cycle'));
  $('m-left-l').textContent=t('left');
  if(s.block==='warmup'){const we=Math.max(...run.tl.segs.filter(x=>x.block==='warmup').map(x=>x.end));{const wi=s.type==='inhale'?t('warm_in_t'):s.type==='exhale'?t('warm_out_t'):'';$('tipx').innerHTML=(wi?esc(wi)+'<br><span style="opacity:.75;font-size:14px;font-weight:400">':'<span>')+esc(T[lang].warm_then(Math.round(run.tl.total-we)))+'</span>'};run.leftLab=null}
}
function completedCycles(){const ct=audio.currentTime;const main=run.tl.segs.filter(s=>s.block==='main');let c=0;for(const s of main){if(ct>=s.end&&s.type==='hold_empty')c=s.rep;else if(ct>=s.end&&params.holdEmpty<=0&&s.type==='exhale')c=s.rep}return c}
function currentPhase(){const ct=audio.currentTime;const s=run.tl.segs.find(s=>ct>=s.start&&ct<s.end);return s?{block:s.block,type:s.type,rep:s.rep}:null}
function abort(reason){log('session:abort',reason);finish(true,reason)}
function finish(aborted,reason){
  if(!run)return;
  cancelAnimationFrame(run.raf);
  const ct=audio.currentTime;
  const cyc=aborted?completedCycles():params.cycles;
  const drifts=run.phaseMarks;const maxDrift=drifts.length?Math.max(...drifts.map(Math.abs)):0;
  run.record={
    id:run.id,schemaVersion:SCHEMA,protocolId:PROTOCOL.id,exerciseId:PROTOCOL.exerciseId,
    startedAt:run.startedAt,endedAt:new Date().toISOString(),
    plannedParams:run.plannedParams,actualParams:run.plannedParams,
    status:aborted?'aborted':'completed',abortReason:aborted?(reason||'user'):null,
    cyclesCompleted:cyc,elapsedSec:Math.round(ct),plannedSec:Math.round(run.tl.total),
    feedback:null,notes:'',nextParams:null,synced:false,owner:user?user.id:null,
    diag:{maxDriftMs:maxDrift,phases:drifts.length,standalone:env().standalone,wake:'wakeLock'in navigator}
  };
  log('session:end',{status:run.record.status,cycles:cyc,elapsed:Math.round(ct),maxDriftMs:maxDrift});
  track(aborted?'session_abort':'session_complete',{reason:aborted?reason:undefined,phase:aborted?currentPhase():undefined,cycles:cyc,elapsed:Math.round(ct),planned:Math.round(run.tl.total)});
  try{audio.pause();audio.onended=null}catch(e){}
  if(run.url)URL.revokeObjectURL(run.url);
  releaseWake();
  $('s-session').style.background='var(--bg)';$('s-session').classList.remove('dark');
  if(aborted&&cyc===0&&ct<30){log('session:discarded-short');track('session_discard',{where:'auto'});run=null;$('b-start').disabled=false;stopArm=0;$('b-stop').textContent=t('stop');goTab('s-home');toast(t('discarded'));return}
  $('fb-title').textContent=aborted?t('abort_title'):t('done_title');
  $('fb-sub').textContent=`${cyc}/${params.cycles} ${t('cycle')} · ${t2(ct)}`;
  document.querySelectorAll('.fb button').forEach(b=>b.classList.remove('sel'));$('fb-notes').value='';fbChoice=null;
  show('s-feedback');$('b-start').disabled=false;
}
let fbChoice=null;
document.querySelectorAll('.fb button').forEach(b=>b.onclick=()=>{fbChoice=b.dataset.v;document.querySelectorAll('.fb button').forEach(x=>x.classList.toggle('sel',x===b))});
$('b-save').onclick=()=>{
  if(!run||!run.record)return show('s-home');
  run.record.feedback=fbChoice;run.record.notes=$('fb-notes').value.trim();
  track('feedback_given',{feedback:fbChoice,hasNotes:!!run.record.notes});
  openNext();
};
$('b-stop').onclick=()=>abort('user');
$('b-start').onclick=()=>startSession().catch(e=>{log('session:crash',e.message);$('b-start').disabled=false;if(run)abort('crash');else show('s-home')});

/* ---------- prossima sessione (proposta ±) ---------- */
let nx={mode:'same',p:null};
const NX_KEYS=['cycles','inhale','holdFull','exhale','holdEmpty'];
function proposal(mode,base){
  const p={...base};const L=PROTOCOL.limits;
  const d=mode==='easier'?-1:mode==='harder'?1:0;
  p.holdFull=clamp(base.holdFull+5*d,L.holdFull);p.holdEmpty=clamp(base.holdEmpty+5*d,L.holdEmpty);
  return p;
}
function clamp(v,[min,max]){return Math.max(min,Math.min(max,v))}
function openNext(){
  const fb=run.record.feedback;nx.mode=fb==='hard'?'easier':fb==='easy'?'harder':'same';
  nx.p=proposal(nx.mode,run.plannedParams);renderNext();show('s-next');
}
function renderNext(){
  document.querySelectorAll('#nx-mode button').forEach(b=>b.classList.toggle('sel',b.dataset.v===nx.mode));
  const labels={cycles:t('set_cycles'),inhale:t('set_in'),holdFull:t('set_hf'),exhale:t('set_out'),holdEmpty:t('set_he')};
  $('nx-steppers').innerHTML=NX_KEYS.map(k=>{const cur=run.plannedParams[k],v=nx.p[k],diff=v-cur;

}
document.querySelectorAll('#nx-mode button').forEach(b=>b.onclick=()=>{nx.mode=b.dataset.v;nx.p=proposal(nx.mode,run.plannedParams);renderNext()});
function finalizeSession(nextParams,accepted){

let stCfg=Object.assign({warmSec:120,voice:true},lsJ('bc.static.v1',{}));
function stSave(){lsSet('bc.static.v1',JSON.stringify(stCfg));renderStatic()}
const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const fmt1=s=>{const m=Math.floor(s/60),r=s-m*60;return `${m}:${r<10?'0':''}${r.toFixed(1)}`};

/* --- voce --- */
const synth=window.speechSynthesis;
function speak(text){
  if(!stCfg.voice||!synth)return;
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='it'?'it-IT':'en-US';u.rate=1;u.pitch=1;u.volume=1;
    const v=synth.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang==='it'?'it':'en'));if(v)u.voice=v;
    u.onstart=()=>log('voice:start',text);u.onerror=e=>log('voice:error',e.error||'?');synth.speak(u);if(synth.paused)synth.resume()}catch(e){log('voice-error',e.message)}
}
function sayRemaining(s){
  if(s<=10)return speak(String(s));
  const m=Math.floor(s/60),r=s%60;
  if(r===0)return speak(T[lang].v_min(m));
  if(r===30)return m?speak(T[lang].v_min30(m)):speak(t('v_30'));
}
if(synth){try{synth.getVoices()}catch(e){}}

/* --- traccia audio riscaldamento (tono ogni 30 s, tick ultimi 10 s, "via" allo zero) --- */
function renderWarmTrack(W){
  return renderCues(W+2,tr=>{
    for(let s=30;s<W;s+=30)tone(tr,W-s,659,659,.15,.35);
    for(let s=10;s>=4;s--)tone(tr,W-s,880,880,.06,.3);
    for(let s=3;s>=1;s--){tone(tr,W-s,1175,1175,.07,.4);tone(tr,W-s+.14,1175,1175,.07,.4)}
    tone(tr,W,392,784,.7);
  });
}
const tapAudio=new Audio();tapAudio.setAttribute('playsinline','');
const TAP_WAV=(()=>{const tr=new Float32Array(Math.round(SR*.12));tone(tr,0,1200,1200,.05,.5);return URL.createObjectURL(wavBlob(tr))})();

/* --- UI intro --- */

  el.children[0].onclick=()=>{stCfg.warmSec=Math.max(0,stCfg.warmSec-30);stSave()};el.children[2].onclick=()=>{stCfg.warmSec=Math.min(300,stCfg.warmSec+30);stSave()};

  $('st-trend').innerHTML=recs.length>=2?trendChart(recs.slice(-20)):'';
  $('st-list').innerHTML=recs.length?recs.slice().reverse().slice(0,30).map(r=>{const d=new Date(r.startedAt),a=r.actualParams;
    return `<div class="hist"><div class="ht"><b>${d.toLocaleDateString(lang)}</b> · <b>${fmt(a.holdSec)}</b>${a.holdSec===pb?' · PB':''} — ${T[lang].st_hist(a.firstContractionSec!=null?fmt(a.firstContractionSec):'',a.contractions.length)}${r.notes?'<br>'+String(r.notes).replace(/</g,'&lt;'):''}</div><button class="del" data-id="${r.id}" aria-label="delete">${ICON.trash}</button></div>`}).join(''):`<p>${t('st_empty')}</p>`;

$('b-st-voice').onclick=()=>{stCfg.voice=!stCfg.voice;stSave();if(stCfg.voice)speak(t('st_title'))};

/* --- motore prova --- */
let srun=null;
async function startStatic(){
  $('b-st-start').disabled=true;
  srun={id:uuid(),startedAt:new Date().toISOString(),phase:'warm',W:stCfg.warmSec,contr:[],lastTap:0,holdStart:null,spoken:new Set(),url:null};
  log('static:start',{id:srun.id,warm:srun.W});track('static_start',{warm:srun.W});
  try{audio.src=SILENCE;await withTimeout(audio.play(),1500,'unlock');tapAudio.src=TAP_WAV;tapAudio.volume=0;await withTimeout(tapAudio.play(),1500,'unlock2').catch(()=>{});tapAudio.volume=1}catch(e){log('audio:unlock-failed',e.message)}
  show('s-static-run');stUI();
  $('st-hint').textContent='';$('b-st-stop').style.display='block';
  if(srun.W>0){
    srun.url=renderWarmTrack(srun.W);audio.src=srun.url;audio.loop=false;
    try{await withTimeout(audio.play(),5000,'play');srun.wallStart=Date.now();log('audio:started')}catch(e){log('audio:play-failed',e.message);return stAbort('play-error')}
    audio.onended=()=>{if(srun&&srun.phase==='warm')stHold()};
    srun.lastS=srun.W;srun.spoken.add(srun.W);
  }else{stHold()}
  acquireWake();stTick();
}
function stHold(){
  if(!srun||srun.phase!=='warm')return;
  srun.phase='hold';srun.holdStart=Date.now();
  // lascia finire il tono di "via", poi silenzio in loop per tenere viva la sessione audio
  audio.onended=()=>{try{audio.src=SILENCE;audio.loop=true;audio.play().catch(()=>{})}catch(e){}};
  if(srun.W===0||audio.ended)audio.onended();
  speak(t('v_go'));log('static:hold-start');
  $('st-hint').textContent=t('st_hint');$('b-st-stop').style.display='none';
  stUI();
}
function stTick(){
  if(!srun)return;
  if(srun.phase==='warm'){
    const el=srun.W>0?audio.currentTime:0;const left=Math.max(0,srun.W-el);const s=Math.ceil(left);
    $('st-num').textContent=fmt(s);$('st-bar').style.width=(srun.W?el/srun.W*100:100).toFixed(1)+'%';
    if(s!==srun.lastS){srun.lastS=s;if(s>0&&(s<=10||s%30===0)&&!srun.spoken.has(s)){srun.spoken.add(s);sayRemaining(s)}}
    if(srun.W>0&&el>=srun.W)stHold();
  }else{
    const h=(Date.now()-srun.holdStart)/1000;
    $('st-num').textContent=fmt(h);const pb=staticPB();$('st-bar').style.width=pb?Math.min(100,h/pb*100).toFixed(1)+'%':'0%';
  }
  srun.raf=requestAnimationFrame(stTick);
}
function stUI(){
  const root=$('s-static-run');root.classList.add('dark');
  if(srun.phase==='warm'){root.style.background='var(--ph-warm)';$('st-ph').textContent=t('st_warm_ph');$('st-sub').textContent=t('st_warm_sub')}
  else{root.style.background='var(--ph-static)';$('st-ph').textContent=t('st_hold_ph');$('st-sub').textContent=t('st_hold_sub')}
  $('st-m-contr').textContent=srun.contr.length;$('st-m-first').textContent=srun.contr.length?fmt(srun.contr[0]):'–';
}
function stTap(){
  if(!srun||srun.phase!=='hold')return;
  const now=Date.now();const h=(now-srun.holdStart)/1000;
  if(now-srun.lastTap<400){srun.contr.pop();srun.lastTap=0;return stFinish(false)}
  srun.lastTap=now;srun.contr.push(Math.round(h*10)/10);
  try{tapAudio.currentTime=0;tapAudio.play().catch(()=>{})}catch(e){}
  if('vibrate'in navigator)navigator.vibrate(30);
  stUI();
}
$('st-tap').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stTap()});
$('b-st-stop').onclick=()=>stAbort('user');
function stAbort(reason){log('static:abort',reason);stFinish(true,reason)}
function stFinish(aborted,reason){
  if(!srun)return;cancelAnimationFrame(srun.raf);
  const holdSec=srun.phase==='hold'?Math.round((Date.now()-srun.holdStart)/10)/100:0;
  try{audio.pause();audio.loop=false;audio.onended=null;if(synth)synth.cancel()}catch(e){}
  if(srun.url)URL.revokeObjectURL(srun.url);releaseWake();
  if(!aborted&&stCfg.voice)speak(t('v_stop'));
  const pbBefore=staticPB();
  srun.record={
    id:srun.id,schemaVersion:SCHEMA,protocolId:STATIC.id,exerciseId:STATIC.exerciseId,
    startedAt:srun.startedAt,endedAt:new Date().toISOString(),
    plannedParams:{warmSec:srun.W},actualParams:{warmSec:srun.W,holdSec,firstContractionSec:srun.contr[0]??null,contractions:srun.contr},
    status:aborted?'aborted':'completed',abortReason:aborted?(reason||'user'):null,
    cyclesCompleted:srun.contr.length,elapsedSec:Math.round(holdSec),plannedSec:srun.W,
    feedback:null,notes:'',nextParams:null,synced:false,owner:user?user.id:null,diag:{standalone:env().standalone,voice:stCfg.voice}
  };
  log('static:end',{status:srun.record.status,hold:holdSec,contr:srun.contr.length});
  track(aborted?'static_abort':'static_complete',{hold:holdSec,contractions:srun.contr.length,first:srun.contr[0]??null});
  $('s-static-run').style.background='var(--bg)';$('s-static-run').classList.remove('dark');
  $('str-title').textContent=aborted?t('st_aborted'):t('st_done');
  const recs=staticRecords(),last=recs[recs.length-1];
  $('str-sub').textContent=pbBefore?T[lang].st_vs(fmt(pbBefore),last?fmt(last.actualParams.holdSec):''):'';
  $('str-total').textContent=fmt1(holdSec);$('str-first').textContent=srun.contr.length?fmt1(srun.contr[0]):'–';$('str-contr').textContent=srun.contr.length;
  const newPB=!aborted&&holdSec>pbBefore&&pbBefore>0;$('str-pb').style.display=newPB?'block':'none';$('str-pb').textContent=newPB?t('st_newpb')+' +'+fmt1(holdSec-pbBefore):'';
  $('str-chart').innerHTML=holdSec>0?attemptChart(holdSec,srun.contr):'';
  $('str-notes').value='';$('str-notes').placeholder=t('notes_ph');
  $('b-st-start').disabled=false;
  if(holdSec<10){log('static:discarded-short');track('static_discard',{hold:holdSec});srun=null;goTab('s-static');toast(t('st_discarded'));return}
  startRecovery();
}
/* --- recupero 1 minuto, respirazione libera --- */
const REC_SEC=60;let rec=null;
function recSteps(){return lang==='en'?['Exhale a little','Sharp inhale through the mouth','Hold 2 s — “hook”','Exhale gently']:['Espira appena','Inspira forte dalla bocca','Blocca 2 s — «hook»','Espira piano']}

/* --- grafici SVG --- */
function attemptChart(total,contr){
  const W=340,H=120,L=8,R=8,top=16,base=78;const x=s=>L+(s/total)*(W-L-R);
  const nb=Math.max(1,Math.ceil(total/10));const buckets=new Array(nb).fill(0);contr.forEach(c=>{buckets[Math.min(nb-1,Math.floor(c/10))]++});const mx=Math.max(1,...buckets);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="aspect-ratio:${W}/${H}">`;
  buckets.forEach((b,i)=>{if(!b)return;const x0=x(i*10),x1=x(Math.min(total,(i+1)*10));const h=(b/mx)*(base-top-4);s+=`<rect x="${x0+1}" y="${base-h}" width="${Math.max(1,x1-x0-2)}" height="${h}" rx="2" fill="rgba(121,201,242,.28)"/>`});
  s+=`<line x1="${L}" y1="${base}" x2="${W-R}" y2="${base}" stroke="rgba(234,244,247,.5)" stroke-width="2"/>`;
  if(contr.length){const f=x(contr[0]);s+=`<rect x="${f}" y="${base-2}" width="${W-R-f}" height="4" fill="var(--ph-hold_full)" opacity=".7"/>`}
  contr.forEach((c,i)=>{s+=`<line x1="${x(c)}" y1="${base-14}" x2="${x(c)}" y2="${base+8}" stroke="${i===0?'var(--ph-hold_full)':'var(--ink)'}" stroke-width="${i===0?2.5:1.5}"/>`});
  const step=total>240?60:30;for(let m=0;m<=total;m+=step){if(m>0&&total-m<step*.4)continue;s+=`<text x="${x(m)}" y="${H-6}" text-anchor="${m===0?'start':m+step>total?'end':'middle'}">${fmt(m)}</text>`;}
  s+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmt(total)}</text>`;
  if(contr.length)s+=`<text x="${Math.min(W-40,x(contr[0]))}" y="${base-20}" fill="var(--ph-hold_full)">${t('st_first')} ${fmt(contr[0])}</text>`;
  return s+'</svg>';
}
function trendChart(recs){
  const W=340,H=140,L=34,R=10,top=14,bot=24;const n=recs.length;const mx=Math.max(...recs.map(r=>r.actualParams.holdSec))*1.08;
  const x=i=>L+(n>1?i/(n-1):0.5)*(W-L-R),y=v=>top+(1-v/mx)*(H-top-bot);
  const hold=recs.map((r,i)=>`${x(i)},${y(r.actualParams.holdSec)}`).join(' ');
  const fc=recs.map((r,i)=>r.actualParams.firstContractionSec!=null?`${x(i)},${y(r.actualParams.firstContractionSec)}`:null).filter(Boolean).join(' ');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H}">`;
  for(const v of [mx/3,2*mx/3,mx/1.08]){s+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="rgba(234,244,247,.1)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`}
  if(fc)s+=`<polyline points="${fc}" fill="none" stroke="var(--ph-hold_full)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<polyline points="${hold}" fill="none" stroke="var(--ph-static)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const pb=Math.max(...recs.map(r=>r.actualParams.holdSec));
  recs.forEach((r,i)=>{const v=r.actualParams.holdSec;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${v===pb?5:3}" fill="${v===pb?'var(--ph-hold_full)':'var(--ph-static)'}"/>`});
  s+=`<text x="${L}" y="${H-6}">${new Date(recs[0].startedAt).toLocaleDateString(lang)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${new Date(recs[n-1].startedAt).toLocaleDateString(lang)}</text>`;
  s+=`<text x="${W-R}" y="${top-2}" text-anchor="end" fill="var(--ph-static)">${t('st_total')} ─ <tspan fill="var(--ph-hold_full)">${t('st_first')} ┄</tspan></text>`;
  return s+'</svg>';
}

const TAB_DEFS=[['s-welcome','home','tab_home','var(--accent)'],['s-home','lungs','tab_breath_s','var(--ph-hold_full)'],['s-static','timer','tab_static_s','var(--ph-static)'],['s-water','sea','tab_water','var(--ph-exhale)'],['s-pb','trophy','tab_pb','var(--ph-inhale)']];
const TABMAP={'s-cal':'s-welcome','s-pb-d':'s-pb','s-pb-add':'s-pb','s-water-add':'s-water','s-st-d':'s-static'};
function renderTabs(active){active=TABMAP[active]||active;
  document.querySelectorAll('[data-tabs]').forEach(nav0=>{const nav=nav0.querySelector('[data-tabrow]')||nav0;nav.innerHTML=TAB_DEFS.map(([id,ic,k,c])=>`<button class="tab${id===active?' sel':''}" data-tab="${id}" style="--c:${c}"><span class="ic">${ICON[ic]}</span><span>${t(k)}</span></button>`).join('');
    nav.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goTab(b.dataset.tab))});
}
function goTab(id){if(id==='s-water'){renderWater();track('water_open')}if(id==='s-pb'){renderPB();track('pb_open')}if(id==='s-static'){renderStatic();track('static_open')}if(id==='s-welcome')renderWelcome();renderTabs(id);show(id)}

/* ---------- welcome ---------- */
function dayKey(d){const x=new Date(d);return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`}
function streakDays(){
  const days=new Set(lsJ(KEY.sess,[]).filter(r=>r.status==='completed'&&r.exerciseId!=='pb').map(r=>dayKey(r.startedAt)));
  let n=0;const d=new Date();if(!days.has(dayKey(d))){d.setDate(d.getDate()-1);if(!days.has(dayKey(d)))return 0}
  while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function renderWelcome(){
  $('wl-hi').textContent=T[lang].wl_hi(userLabel()||(profile&&profile.display_name)||'');
  $('wl-streak').textContent=T[lang].wl_streak(streakDays());
  const br=lsJ(KEY.sess,[]).filter(r=>r.exerciseId==='breathing'&&r.status==='completed').pop();
  $('wl-breath-sub').textContent=T[lang].wl_breath_sub(br?`${new Date(br.startedAt).toLocaleDateString(lang)} · ${t2(br.elapsedSec)}`:'');
  const pb=staticPB();$('wl-static-sub').textContent=T[lang].wl_static_sub(pb?fmt(pb):'');
  $('wl-pb-sub').textContent=T[lang].pb_sub_wl(pbRecords().length);
  $('wl-tip').textContent=t('wl_tip');$('ver2').textContent=`Breathing Coach v${VERSION} · Orbita by Quota Zero`;
  const b3=$('b-account3');b3.textContent=$('b-account').textContent;b3.style.display=isGuest()?'block':'none';
}
$('wl-pb').onclick=()=>goTab('s-pb');$('wl-water').onclick=()=>goTab('s-water');$('wl-breath').onclick=()=>goTab('s-home');$('wl-static').onclick=()=>goTab('s-static');
$('b-account3').onclick=()=>openAccount(false);
$('b-lang2').onclick=()=>$('b-lang').click();

const DISC={dry:['DRY'],pool:['STA','DYN','DYNB','DNF'],sea:['CWT','CWTB','CNF','FIM']};
const DISC_KIND={DRY:'time',STA:'time',DYN:'dist',DYNB:'dist',DNF:'dist',CWT:'depth',CWTB:'depth',CNF:'depth',FIM:'depth'};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pbRecords(){return lsJ(KEY.sess,[]).filter(r=>r.exerciseId==='pb'&&r.status==='completed'&&r.actualParams&&r.actualParams.value>0)}
function pbFmt(d,v){return DISC_KIND[d]==='time'?fmt(v):`${Math.round(v*10)/10} m`}
function pbSpark(vals){if(vals.length<2)return '';const W=120,H=28,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(W-6)+3).toFixed(1)},${(H-4-(v-mn)/rg*(H-8)).toFixed(1)}`).join(' ');
  return `<div style="margin-top:6px;line-height:0"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="var(--c)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
let pbOpen=null;
function renderPB(){
  $('b-pb-add').innerHTML=ICON.pencil+' '+t('pb_new');
  const recs=pbRecords().sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));
  const by={};recs.forEach(r=>{(by[r.actualParams.discipline]=by[r.actualParams.discipline]||[]).push(r)});
  const spb=staticPB();
  const card=(code,list,color,dry)=>{
    const vals=list.map(r=>r.actualParams.value),best=Math.max(...vals),bestRec=list.slice().reverse().find(r=>r.actualParams.value===best);
    const open=pbOpen===code;
    return `<div class="pbcard" style="--c:${color}" data-d="${code}" ${dry?'':'role="button"'}><div class="pbh"><span class="pbn">${esc(T[lang]['D_'+code])} <small>${code}</small></span><span class="pbv">${pbFmt(code,best)}</span></div>
      <small>${dry?t('pb_dry_note'):new Date(bestRec.startedAt).toLocaleDateString(lang)+' · '+T[lang].pb_att(list.length)}</small>${dry?'':pbSpark(vals)}
      ${open&&!dry?'<div style="margin-top:8px">'+list.slice().reverse().map(r=>`<div class="hist" style="margin:0"><div class="ht"><b>${new Date(r.startedAt).toLocaleDateString(lang)}</b> · ${pbFmt(code,r.actualParams.value)}${r.notes?'<br>'+esc(r.notes):''}</div><button class="del" data-id="${r.id}" aria-label="delete">${ICON.trash}</button></div>`).join('')+'</div>':''}</div>`};
  let html='';
  const dry=spb?`<div class="pbgrp" style="--c:var(--ph-static)"><span class="ic">${ICON.timer}</span>${t('pb_g_dry')}</div>`+card('STA',[{actualParams:{value:spb},startedAt:new Date()}],'var(--ph-static)',true):'';
  const grp=(key,icon,col)=>{const codes=DISC[key].filter(c=>by[c]);return codes.length?`<div class="pbgrp" style="--c:${col}"><span class="ic">${ICON[icon]}</span>${t('pb_g_'+key)}</div>`+codes.map(c=>card(c,by[c],col,false)).join(''):''};
  html=dry+grp('pool','pool','var(--ph-hold_empty)')+grp('sea','sea','var(--ph-exhale)');
  if(!html){html=`<div class="pbempty"><img alt="" src="data:image/png;base64,${LOGO_B64}"><b style="font-size:18px">${t('pb_empty_t')}</b><span class="mut" style="color:var(--ink2);font-size:14px;max-width:290px">${t('pb_empty_s')}</span><button class="btn" id="b-pb-first" style="margin-top:6px;max-width:260px">+ ${t('pb_new')}</button></div>`}
  $('pb-body').innerHTML=html;
  const first=$('b-pb-first');if(first)first.onclick=openPBAdd;
  $('pb-body').querySelectorAll('.pbcard[role=button]').forEach(c=>c.onclick=e=>{if(e.target.closest('.del'))return;pbOpen=pbOpen===c.dataset.d?null:c.dataset.d;renderPB()});
  bindDeletes($('pb-body'),renderPB);
}
let pbSel=null;
function openPBAdd(){
  pbSel=null;$('pbadd-err').textContent='';$('pbadd-notes').value='';$('pbadd-notes').placeholder=t('notes_ph');
  const d=new Date();$('pbadd-date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('pbadd-date').max=$('pbadd-date').value;
  renderPBAdd();show('s-pb-add');track('pb_add_open');
}
function renderPBAdd(){
  const g=(key,icon,col)=>`<div class="pbgrp" style="--c:${col};margin:10px 0 0"><span class="ic">${ICON[icon]}</span>${t('pb_g_'+key)}</div><div class="chips2" style="--c:${col}">${DISC[key].map(c=>`<button data-c="${c}" class="${pbSel===c?'sel':''}">${c} · ${esc(T[lang]['D_'+c])}</button>`).join('')}</div>`;
  $('pbadd-disc').innerHTML=g('dry','timer','var(--ph-static)')+g('pool','pool','var(--ph-hold_empty)')+g('sea','sea','var(--ph-exhale)');
  $('pbadd-disc').querySelectorAll('button').forEach(b=>b.onclick=()=>{pbSel=b.dataset.c;renderPBAdd()});
  const kind=pbSel?DISC_KIND[pbSel]:null;
  $('pbadd-vlabel').textContent=kind==='time'?t('pb_time'):kind==='depth'?t('pb_depth'):kind==='dist'?t('pb_dist'):'';
  $('pbadd-vin').innerHTML=!kind?'':kind==='time'?`<input id="pbadd-min" type="number" inputmode="numeric" min="0" max="30" placeholder="0"> <span>${t('pb_min')}</span> <input id="pbadd-sec" type="number" inputmode="numeric" min="0" max="59" placeholder="00"> <span>${t('pb_sec')}</span>`:`<input id="pbadd-m" type="number" inputmode="decimal" min="0" max="400" step="0.5" placeholder="0"> <span>${t('pb_m')}</span>`;
}
$('b-pb-add').onclick=openPBAdd;
$('b-pbadd-back').onclick=()=>goTab('s-pb');
$('b-pbadd-save').onclick=()=>{
  if(!pbSel)return $('pbadd-err').textContent=t('pb_err_disc');
  let v;if(DISC_KIND[pbSel]==='time')v=(+($('pbadd-min').value||0))*60+(+($('pbadd-sec').value||0));else v=+($('pbadd-m').value||0);

const VAPID_PUB='BKhbbX1hV1Nd6IV0GSApPZEo4l03CfA3OAlUuyavZ5-gEb22Y1W6JB1wLf-_ffeoFMtVOU9VWZwbXmawpFtbtCo';
const pushOK=()=>('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
function pushT(){const en=lang==='en';return en?{h:'Daily reminder',on:'Turn on reminders',off:'Turn off',time:'Remind me at',streak:'Warn me if I’m about to lose my streak',s_on:'Reminders are on.',s_off:'Get a daily nudge to train.',s_ios:'To get notifications, add the app to the Home screen first.',s_no:'This browser doesn’t support notifications.',s_den:'Notifications are blocked. Enable them in your phone settings.',s_err:'Couldn’t turn on reminders. Try again.'}:{h:'Promemoria giornaliero',on:'Attiva i promemoria',off:'Disattiva',time:'Ricordamelo alle',streak:'Avvisami se rischio di perdere la serie',s_on:'Promemoria attivi.',s_off:'Ricevi ogni giorno un promemoria per allenarti.',s_ios:'Per ricevere le notifiche aggiungi prima l’app alla Home.',s_no:'Questo browser non supporta le notifiche.',s_den:'Le notifiche sono bloccate. Attivale dalle impostazioni del telefono.',s_err:'Non sono riuscito ad attivare i promemoria. Riprova.'}}
function b64u(b){const p='='.repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
function ab2b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function pushReg(){return navigator.serviceWorker.register('sw.js')}
async function renderPush(){
  const x=pushT();$('push-h').textContent=x.h;$('b-push-on').textContent=x.on;$('b-push-off').textContent=x.off;$('push-time-l').textContent=x.time;$('push-streak-l').textContent=x.streak;
  const card=$('push-card');if(!user||user.is_anonymous){card.style.display='none';return}card.style.display='';
  $('b-push-on').style.display='none';$('push-opts').style.display='none';
  if(!pushOK()){$('push-state').textContent=isIOS&&!env().standalone?x.s_ios:x.s_no;return}
  if(Notification.permission==='denied'){$('push-state').textContent=x.s_den;return}
  let sub=null;try{const reg=await navigator.serviceWorker.getRegistration('sw.js')||await pushReg();sub=await reg.pushManager.getSubscription()}catch(e){}
  if(sub){
    $('push-state').textContent=x.s_on;$('push-opts').style.display='';
    try{const {data}=await sb.from('push_subs').select('remind_time,streak_on').eq('endpoint',sub.endpoint).maybeSingle();
      if(data){$('push-time').value=String(data.remind_time).slice(0,5);$('push-streak').checked=!!data.streak_on}}catch(e){}
  }else{$('push-state').textContent=x.s_off;$('b-push-on').style.display=''}
}
async function pushSave(sub){
  const j=sub.toJSON();
  const row={user_id:user.id,endpoint:sub.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Rome',
    remind_on:true,remind_time:$('push-time').value||'19:00',streak_on:$('push-streak').checked,last_sent:null};
  const {error}=await sb.from('push_subs').upsert(row,{onConflict:'endpoint'});if(error)throw error;
}
$('b-push-on').onclick=async()=>{
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted'){await renderPush();return}
    const reg=await pushReg();await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
    await pushSave(sub);track('push_on');log('push:on');
  }catch(e){log('push:error',e.message);$('push-state').textContent=pushT().s_err;return}
  renderPush();
};
async function pushUpdate(){
  try{const reg=await navigator.serviceWorker.getRegistration('sw.js');const sub=reg&&await reg.pushManager.getSubscription();if(!sub)return;
    await sb.from('push_subs').update({remind_time:$('push-time').value||'19:00',streak_on:$('push-streak').checked,last_sent:null}).eq('endpoint',sub.endpoint)}catch(e){log('push:update-error',e.message)}
}
$('push-time').onchange=pushUpdate;$('push-streak').onchange=pushUpdate;
$('b-push-off').onclick=async()=>{
  try{const reg=await navigator.serviceWorker.getRegistration('sw.js');const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}track('push_off')}catch(e){log('push:off-error',e.message)}

};

/* ---------- aggiornamento automatico ---------- */
const vnum=v=>String(v||'0').split('.').map(n=>+n||0);
const vNewer=(a,b)=>{const x=vnum(a),y=vnum(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
const BUSY=['s-water-add','s-session','s-feedback','s-next','s-static-run','s-static-rec','s-static-result','s-pb-add','s-disclaimer','s-onb'];
async function autoUpdate(){
  try{
    if(!navigator.onLine)return;
    const cur=document.querySelector('.screen.on');if(cur&&BUSY.includes(cur.id))return;
    const r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=((await r.text()).match(/VERSION='([0-9.]+)'/)||[])[1];
    if(!v||!vNewer(v,VERSION))return;
    let tried=null;try{tried=sessionStorage.getItem('bc.autoupd')}catch(e){}
    if(tried===v)return;                       // già provato in questa sessione: niente cicli
    try{sessionStorage.setItem('bc.autoupd',v)}catch(e){}
    log('app:auto-update',{from:VERSION,to:v});
    try{await pushPrefs()}catch(e){}
    location.replace(location.pathname+'?u='+Date.now());
  }catch(e){log('app:auto-update-error',e.message)}
}
setTimeout(autoUpdate,2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(autoUpdate,800)});

$('b-update').onclick=async()=>{
  const m=$('upd-msg'),en=lang==='en';m.textContent=en?'Checking…':'Controllo…';
  try{
    const r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});const tx=await r.text();
    const v=(tx.match(/VERSION='([0-9.]+)'/)||[])[1];
    try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
    try{if(navigator.serviceWorker){for(const g of await navigator.serviceWorker.getRegistrations())await g.unregister()}}catch(e){}
    if(v&&v===VERSION){m.textContent=en?`You already have the latest version (v${VERSION}).`:`Hai già l'ultima versione (v${VERSION}).`;return}
    m.textContent=en?`Updating to v${v||'?'}…`:`Aggiorno alla v${v||'?'}…`;
    await pushPrefs().catch(()=>{});
    setTimeout(()=>location.replace(location.pathname+'?u='+Date.now()),500);
  }catch(e){m.textContent=en?'No connection. Try again.':'Nessuna connessione. Riprova.'}
};

/* --- attività, serie, settimana --- */
function actType(r){
  if(r.exerciseId==='breathing')return(r.status==='completed'||(r.elapsedSec||0)>=120)?'breath':null;
  if(r.exerciseId==='static')return 'static';
  if(r.exerciseId==='water')return r.status==='completed'?'water':null;
  if(r.exerciseId==='pb')return r.status==='completed'?'pb':null;
  return null;
}
function actsByDay(){const m={};lsJ(KEY.sess,[]).forEach(r=>{const ty=actType(r);if(ty){const k=dayKey(r.startedAt);(m[k]=m[k]||[]).push({ty,r})}});return m}
function streakDays(){
  const days=actsByDay();let n=0;const d=new Date();
  if(!days[dayKey(d)]){d.setDate(d.getDate()-1);if(!days[dayKey(d)])return 0}
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n;
}
function ringHTML(types,inner,cls){
  const u=[...new Set(types)];
  if(!u.length)return `<span class="dr e ${cls||''}"><i>${inner||''}</i></span>`;
  const bg=u.length===1?COL[u[0]]:`conic-gradient(${u.map((c,i)=>`${COL[c]} ${i*100/u.length}% ${(i+1)*100/u.length}%`).join(',')})`;
  return `<span class="dr ${cls||''}" style="background:${bg}"><i>${inner||''}</i></span>`;
}
function weekStart(d0){const d=new Date(d0||Date.now());d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function renderWeek(){
  const days=actsByDay(),ws=weekStart(),today=dayKey(new Date());let n=0,html='';
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(ws.getDate()+i);const k=dayKey(d),a=days[k]||[],ty=a.map(x=>x.ty);n+=a.length;
    const fut=d>new Date()&&k!==today;
    const inner=ty.length===1?`<span style="color:${COL[ty[0]]};display:flex">${ICON[ty[0]==='breath'?'lungs':ty[0]==='water'?'sea':ty[0]==='pb'?'trophy':'timer']}</span>`:ty.length>1?String(ty.length):'';
    html+=`<div class="wkd${k===today?' today':''}"><span>${T[lang].wd[i]}</span>${ringHTML(ty,inner,fut?'fut':'')}</div>`;

function allEntries(code){
  const out=[];
  pbRecords().filter(r=>r.actualParams.discipline===code).forEach(r=>out.push({id:r.id,t:+new Date(r.startedAt),v:r.actualParams.value,src:'pb',rec:r}));
  if(code==='DRY')staticRecords().forEach(r=>out.push({id:r.id,t:+new Date(r.startedAt),v:r.actualParams.holdSec,src:'static',rec:r}));
  return out.sort((a,b)=>a.t-b.t);
}
function discsWithData(){return [...DISC.dry,...DISC.pool,...DISC.sea].filter(c=>allEntries(c).length)}
function staticPB(){return allEntries('DRY').reduce((m,e)=>Math.max(m,e.v),0)}
