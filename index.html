  const grp=(key,icon,col)=>{const codes=DISC[key].filter(c=>allEntries(c).length);return codes.length?`<div class="pbgrp" style="--c:${col}"><span class="ic">${ICON[icon]}</span>${t('pb_g_'+key)}</div>`+codes.map(c=>{
    const es=allEntries(c),best=es.reduce((m,e)=>e.v>=m.v?e:m,es[0]);
    return `<div class="pbcard" style="--c:${col}" data-d="${c}" role="button"><div class="pbh"><span class="pbn">${esc(T[lang]['D_'+c])} <small>${c==='DRY'?'':c}</small></span><span style="display:flex;align-items:baseline"><span class="pbv">${pbFmt(c,best.v)}</span><span class="chv">›</span></span></div><small>${new Date(best.t).toLocaleDateString(lang)} · ${T[lang].s_pb_att(es.length)}</small></div>`}).join(''):''};
  let html=grp('dry','timer','var(--ph-static)')+grp('pool','pool','var(--ph-hold_empty)')+grp('sea','sea','var(--ph-exhale)');
  if(!html){html=`<div class="pbempty"><img alt="" src="data:image/png;base64,${LOGO_B64}"><b style="font-size:18px">${t('pb_empty_t')}</b><span class="mut" style="color:var(--ink2);font-size:14px;max-width:290px">${t('pb_empty_s')}</span><button class="btn" id="b-pb-first" style="margin-top:6px;max-width:260px">+ ${t('pb_new')}</button></div>`}
  $('pb-body').innerHTML=html;
  const first=$('b-pb-first');if(first)first.onclick=()=>openPBAdd();
  $('pb-body').querySelectorAll('.pbcard').forEach(c=>c.onclick=()=>openDisc(c.dataset.d));
}
function discChart(es,code,col){
  if(es.length<2)return '';
  const W=340,H=140,L=44,R=10,top=14,bot=24,n=es.length,vals=es.map(e=>e.v),mx=Math.max(...vals)*1.08,mn=Math.min(0,...vals);
  const x=i=>L+(i/(n-1))*(W-L-R),y=v=>top+(1-(v-mn)/(mx-mn))*(H-top-bot);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H}">`;
  for(const v of [mx/3,2*mx/3,mx/1.08])s+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="rgba(234,244,247,.1)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${pbFmt(code,v)}</text>`;
  s+=`<polyline points="${es.map((e,i)=>x(i)+','+y(e.v)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const best=Math.max(...vals);
  es.forEach((e,i)=>{s+=`<circle cx="${x(i)}" cy="${y(e.v)}" r="${e.v===best?5:3}" fill="${e.v===best?'var(--ph-inhale)':col}"/>`});
  s+=`<text x="${L}" y="${H-6}">${new Date(es[0].t).toLocaleDateString(lang)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${new Date(es[n-1].t).toLocaleDateString(lang)}</text>`;
  return s+'</svg>';
}
function openDisc(code){pbCur=code;renderDisc();renderTabs('s-pb-d');show('s-pb-d');track('pb_disc_open',{discipline:code})}
function renderDisc(){
  const code=pbCur,es=allEntries(code),isSea=DISC.sea.includes(code),col=isSea?'var(--ph-exhale)':DISC.dry.includes(code)?'var(--ph-static)':'var(--ph-hold_empty)';
  if(!es.length){return goTab('s-pb')}
  const best=Math.max(...es.map(e=>e.v));
  $('pbd-title').textContent=T[lang]['D_'+code];$('pbd-sub').textContent=code==='DRY'?'':code;
  $('pbd-best').textContent=pbFmt(code,best);$('pbd-n').textContent=es.length;
  $('pbd-chart').innerHTML=discChart(es,code,col);
  const bestId=es.slice().reverse().find(e=>e.v===best).id;
  $('pbd-list').innerHTML=es.slice().reverse().map(e=>{const d=new Date(e.t);
    return `<div class="hist${e.src==='static'?' tap':''}" data-id="${e.id}" data-src="${e.src}"><div class="ht"><b>${d.toLocaleDateString(lang)}</b> · <b>${pbFmt(code,e.v)}</b>${e.id===bestId?' · <span style="color:var(--ph-inhale)">'+t('pb_tag')+'</span>':''}${e.src==='static'?' · '+t('st_title').toLowerCase():''}${e.rec.notes?'<br>'+esc(e.rec.notes):''}</div>${e.src==='pb'?`<button class="ed" data-id="${e.id}" aria-label="edit">${ICON.pencil}</button>`:''}<button class="del" data-id="${e.id}" aria-label="delete">${ICON.trash}</button></div>`}).join('');
  $('b-pbd-add').textContent=t('add_result');
  bindDeletes($('pbd-list'),renderDisc);
  $('pbd-list').querySelectorAll('.ed').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openPBAdd(code,es.find(e=>e.id===b.dataset.id).rec)});
  $('pbd-list').querySelectorAll('.hist.tap').forEach(h=>h.onclick=ev=>{if(ev.target.closest('.del'))return;openStDetail(h.dataset.id)});
}
$('b-pbd-back').onclick=()=>goTab('s-pb');
$('b-pbd-add').onclick=()=>openPBAdd(pbCur);

function openPBAdd(code,rec,day,from){
  pbEdit=rec||null;pbFrom=from||null;pbSel=rec?rec.actualParams.discipline:(typeof code==='string'?code:null);
  $('pbadd-err').textContent='';$('pbadd-notes').value=rec?(rec.notes||''):'';$('pbadd-notes').placeholder=t('notes_ph');
  const n=new Date(),todayISO=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  let iso=todayISO;if(rec){const d=new Date(rec.startedAt);iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}else if(day){iso=keyToISO(day)}
  if(iso>todayISO)iso=todayISO;
  $('pbadd-date').value=iso;$('pbadd-date').max=todayISO;
  renderPBAdd();
  if(rec){const v=rec.actualParams.value;if(DISC_KIND[pbSel]==='time'){$('pbadd-min').value=Math.floor(v/60);$('pbadd-sec').value=Math.round(v%60)}else $('pbadd-m').value=v}
  $('pbadd-title').textContent=rec?t('edit_result'):t('pb_add_title');
  renderTabs(from==='cal'?'s-cal':'s-pb-add');show('s-pb-add');track('pb_add_open',{from:from||'pb'});
}
function pbAddExit(){if(pbFrom==='cal'){pbFrom=null;renderCal();renderTabs('s-cal');show('s-cal')}else if(pbCur&&allEntries(pbCur).length)openDisc(pbCur);else goTab('s-pb')}
$('b-pb-add').onclick=()=>openPBAdd();
$('b-pbadd-back').onclick=pbAddExit;
$('b-pbadd-save').onclick=()=>{
  if(!pbSel)return $('pbadd-err').textContent=t('pb_err_disc');
  let v;if(DISC_KIND[pbSel]==='time')v=(+($('pbadd-min').value||0))*60+(+($('pbadd-sec').value||0));else v=+($('pbadd-m').value||0);
  if(!(v>0)||v>(DISC_KIND[pbSel]==='time'?1800:400))return $('pbadd-err').textContent=t('pb_err');
  const day=$('pbadd-date').value;const when=day?new Date(day+'T12:00:00'):new Date();
  const all=lsJ(KEY.sess,[]);
  if(pbEdit){const r=all.find(x=>x.id===pbEdit.id);if(r){r.startedAt=r.endedAt=when.toISOString();r.actualParams={discipline:pbSel,value:Math.round(v*10)/10,unit:DISC_KIND[pbSel]==='time'?'s':'m'};r.notes=$('pbadd-notes').value.trim();r.synced=false}track('pb_edited',{discipline:pbSel})}
  else{
    const rec={id:uuid(),schemaVersion:SCHEMA,protocolId:'pb-log-v1',exerciseId:'pb',startedAt:when.toISOString(),endedAt:when.toISOString(),plannedParams:{},actualParams:{discipline:pbSel,value:Math.round(v*10)/10,unit:DISC_KIND[pbSel]==='time'?'s':'m'},status:'completed',abortReason:null,cyclesCompleted:0,elapsedSec:0,plannedSec:0,feedback:null,notes:$('pbadd-notes').value.trim(),nextParams:null,synced:false,owner:user?user.id:null,diag:{}};
    all.push(rec);track('pb_saved',{discipline:pbSel,value:rec.actualParams.value});log('pb:saved',rec.id)}
  lsSet(KEY.sess,JSON.stringify(all));pushSessions();pbEdit=null;if(pbFrom==='cal'){pbCur=pbSel;pbAddExit()}else openDisc(pbSel);
};

/* --- apnea statica: pagina, minuti, dettaglio prova --- */
const warmLabel=s=>s===0?'0':s<60?`${s} s`:s%60===0?`${s/60} min`:`${Math.floor(s/60)} min ${s%60} s`;
function renderStatic(){
  const el=$('st-warm');el.innerHTML=`<button>−</button><span class="v" style="min-width:84px">${warmLabel(stCfg.warmSec)}</span><button>+</button>`;
  el.children[0].onclick=()=>{stCfg.warmSec=Math.max(0,stCfg.warmSec-30);stSave()};el.children[2].onclick=()=>{stCfg.warmSec=Math.min(300,stCfg.warmSec+30);stSave()};
  $('b-st-voice').textContent=stCfg.voice?'ON':'OFF';$('b-st-voice').classList.toggle('acc',stCfg.voice);
  const recs=staticRecords(),pb=staticPB(),last=recs[recs.length-1];
  $('st-pb').textContent=pb?fmt(pb):'–';$('st-last').textContent=last?fmt(last.actualParams.holdSec):'–';$('st-count').textContent=recs.length;
  $('st-trend').innerHTML=recs.length>=2?trendChart(recs.slice(-20)):'';
  $('st-list').innerHTML=recs.length?recs.slice().reverse().slice(0,40).map(r=>{const d=new Date(r.startedAt),a=r.actualParams;
    return `<div class="hist tap" data-id="${r.id}"><div class="ht"><b>${d.toLocaleDateString(lang)}</b> · <b>${fmt(a.holdSec)}</b>${a.holdSec===pb?' · '+t('pb_tag'):''} — ${T[lang].st_hist(a.firstContractionSec!=null?fmt(a.firstContractionSec):'',a.contractions.length)}</div><button class="del" data-id="${r.id}" aria-label="delete">${ICON.trash}</button></div>`}).join(''):`<p>${t('st_empty')}</p>`;
  bindDeletes($('st-list'),renderStatic);
  $('st-list').querySelectorAll('.hist.tap').forEach(h=>h.onclick=ev=>{if(ev.target.closest('.del'))return;openStDetail(h.dataset.id)});
}
let stDetId=null,stDetBack='s-static';
function openStDetail(id){
  const r=lsJ(KEY.sess,[]).find(x=>x.id===id);if(!r)return;stDetId=id;stDetBack=document.querySelector('.screen.on').id==='s-pb-d'?'s-pb-d':'s-static';
  const a=r.actualParams,d=new Date(r.startedAt);
  $('std-title').textContent=t('st_title');$('std-sub').textContent=d.toLocaleDateString(lang)+' '+d.toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'});
  $('std-total').textContent=fmt1(a.holdSec);$('std-first').textContent=a.firstContractionSec!=null?fmt1(a.firstContractionSec):'–';$('std-contr').textContent=(a.contractions||[]).length;
  $('std-chart').innerHTML=a.holdSec>0?attemptChart(a.holdSec,a.contractions||[]):'';
  $('std-notes').textContent=r.notes||'';$('b-std-del').innerHTML=ICON.trash.replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px;margin-right:6px"')+t('del_test');
  renderTabs('s-st-d');show('s-st-d');track('static_detail_open');
}
$('b-std-back').onclick=()=>{if(stDetBack==='s-pb-d'&&pbCur&&allEntries(pbCur).length)openDisc(pbCur);else goTab('s-static')};
$('b-std-del').onclick=async()=>{if(!confirm(t('del_confirm')))return;await deleteSession(stDetId);if(stDetBack==='s-pb-d'&&pbCur&&allEntries(pbCur).length)openDisc(pbCur);else goTab('s-static')};

/* --- annulla allenamento --- */
$('b-fb-discard').onclick=()=>{if(!confirm(t('discard_confirm')))return;log('session:discarded');track('session_discard',{where:'feedback'});run=null;goTab('s-home');toast(t('discarded'))};
let stopArm=0;
$('b-stop').onclick=()=>{
  const el=run&&audio.currentTime||0;
  if(el<30||Date.now()-stopArm<3000){stopArm=0;$('b-stop').textContent=t('stop');return abort('user')}
  stopArm=Date.now();$('b-stop').textContent=t('stop_again');setTimeout(()=>{if(Date.now()-stopArm>=2900){stopArm=0;$('b-stop').textContent=t('stop')}},3000);
};


/* --- grafico prova: fasi + una colonna per contrazione --- */
Object.assign(T.it,{st_legend:'La barra in alto mostra la fase tranquilla e quella con contrazioni. Ogni colonna è una contrazione: più è bassa, più è vicina alla precedente.',ph_calm:'senza contrazioni',ph_contr:'con contrazioni',since_prev:'dalla precedente',ct_none:'Nessuna contrazione segnata.',ct_n:'contrazione'});
Object.assign(T.en,{st_legend:'The top bar shows the calm phase and the phase with contractions. Each column is one contraction: the lower it is, the closer to the previous one.',ph_calm:'no contractions',ph_contr:'with contractions',since_prev:'since previous',ct_none:'No contractions marked.',ct_n:'contraction'});
function attemptChart(total,contr){
  contr=contr||[];const n=contr.length;
  const c0=n?Math.min(contr[0],total):total,rest=Math.max(0,total-c0),pc=Math.round(c0/total*100);
  let h=`<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bg2)"><div style="width:${pc}%;background:var(--ph-static);opacity:.75"></div><div style="width:${100-pc}%;background:var(--ph-hold_full)"></div></div>
  <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin:8px 0 18px"><span><b style="color:var(--ph-static)">${fmt(c0)}</b> ${t('ph_calm')}</span>${n?`<span style="text-align:right"><b style="color:var(--ph-hold_full)">${fmt(rest)}</b> ${t('ph_contr')}</span>`:''}</div>`;
  if(!n)return h+`<p>${t('ct_none')}</p>`;
  const iv=contr.map((c,i)=>i?c-contr[i-1]:null),mx=Math.max(1,...iv.filter(v=>v!=null));
  const W=340,H=150,L=8,R=8,top=22,base=108,bw=Math.min(34,(W-L-R)/n*.62),gap=(W-L-R)/n;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="aspect-ratio:${W}/${H}">`;
  g+=`<line x1="${L}" y1="${base}" x2="${W-R}" y2="${base}" stroke="rgba(234,244,247,.35)" stroke-width="1.5"/>`;
  const every=n>12?2:1;
  contr.forEach((c,i)=>{
    const cx=L+gap*(i+.5),hh=i===0?14:Math.max(6,(iv[i]/mx)*(base-top-8)),col=i===0?'var(--ph-hold_full)':'var(--ph-static)';
    g+=`<rect x="${cx-bw/2}" y="${base-hh}" width="${bw}" height="${hh}" rx="4" fill="${col}" opacity="${i===0?1:.8}"/>`;
    if(i%every===0){
      if(i>0)g+=`<text x="${cx}" y="${base-hh-5}" text-anchor="middle" style="font-size:10px;fill:var(--ink)">${Math.round(iv[i])}s</text>`;
      g+=`<text x="${cx}" y="${base+15}" text-anchor="middle">${i+1}</text><text x="${cx}" y="${base+29}" text-anchor="middle" style="font-size:9px">${fmt(c)}</text>`;
    }
  });
  g+='</svg>';
  const rows=contr.map((c,i)=>`<div class="dayrow"><i style="background:${i===0?'var(--ph-hold_full)':'var(--ph-static)'}"></i><span><b>${i+1}</b> · ${fmt1(c)}${i?` · <span style="color:var(--ink2)">+${Math.round(iv[i]*10)/10} s ${t('since_prev')}</span>`:''}</span></div>`).join('');
  return h+g+`<div style="margin-top:6px">${rows}</div>`;
}

applyLang();
(async()=>{
  // Google già collegato a un altro account (link ospite fallito): accedi direttamente a quell'account
  try{const h=location.hash+location.search;if(/identity_already_exists|already.{0,20}linked/i.test(decodeURIComponent(h))&&!sessionStorage.getItem('bc.relogin')){
    sessionStorage.setItem('bc.relogin','1');history.replaceState(null,'',location.pathname);log('auth:relogin-google');
    await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});return}
    sessionStorage.removeItem('bc.relogin')}catch(e){log('auth:relogin-error',e.message)}
  // migrazione record v0.1 (senza flag synced)
  const all=lsJ(KEY.sess,[]);let mig=false;all.forEach(r=>{if(r.synced===undefined){r.synced=false;mig=true}});if(mig)lsSet(KEY.sess,JSON.stringify(all));
  if(!ls(KEY.acc)){show('s-disclaimer')}
  else if(!profile||!profile.onboarding_done){renderOnb();show('s-onb')}
  else goTab('s-welcome');
  if(ls(KEY.acc))await ensureUser(); else {const {data:{session}}=sb?await sb.auth.getSession():{data:{}};if(session)user=session.user}
  if(sb)sb.auth.onAuthStateChange(async(ev,session)=>{log('auth:event',ev);if(session){user=session.user;if((ev==='SIGNED_IN'||ev==='USER_UPDATED')&&!user.is_anonymous){await afterLogin(user.app_metadata?.provider||'oauth')}}});
  track('app_open',{standalone:env().standalone,lang});
  renderAccountPill();
  if(user){registerDevice();if(profile&&profile.onboarding_done)saveProfile({});pullPrefs();await pullSessions();await syncAll()}
  renderAccountPill();
})();
