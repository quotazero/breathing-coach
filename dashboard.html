<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard · Blue World Freediving</title>
<link rel="icon" href="icons/blueworld-fav.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#061A2B;--bg2:#0B2A40;--bg3:#103750;--ink:#EAF4F7;--ink2:#8FB1C2;--line:rgba(234,244,247,.14);
  --accent:#8FE0D2;--danger:#F08A7A;--warn:#F2C879;--blue:#7FB4F0;--violet:#C4A6EA;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
h1,h2,h3{margin:0;font-weight:600}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:2px 6px}
.brand img{width:100%;max-width:176px;height:auto;border-radius:12px;display:block}
.brand small{display:block;font-weight:400;color:var(--ink2);font-size:12px;margin-top:3px}
.login .lg{display:block;width:180px;height:auto;border-radius:12px;margin:0 auto 18px}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:3px}
.nav button{text-align:left;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.sel{background:rgba(143,224,210,.14);color:var(--accent)}
.sidefoot{margin-top:auto;font-size:12px;color:var(--ink2);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.sidefoot button{color:var(--ink2);text-align:left;text-decoration:underline;font-size:12px}
.main{padding:28px 34px 60px;max-width:1280px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px}.top p{margin:4px 0 0;color:var(--ink2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#04131D;border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.cal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calh h2{margin:0;font-size:18px;text-transform:capitalize}
.calh button{background:var(--bg3);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cg .dw{font-size:12px;color:var(--ink2);text-align:center;padding:2px 0}
.cd{min-height:92px;border:1px solid var(--line);border-radius:12px;padding:6px;background:rgba(6,26,43,.45);font-size:12px;overflow:hidden}
.cd.adm{cursor:pointer}.cd.adm:hover{border-color:var(--accent)}.cd.out{opacity:.35}.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cd b{display:block;font-size:13px;margin-bottom:4px;font-weight:600}.cd.today b{color:var(--accent)}
.ev{display:block;background:rgba(143,224,210,.16);color:var(--accent);border-radius:7px;padding:2px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.c{background:rgba(196,166,234,.18);color:var(--violet)}.ev.d{background:rgba(127,180,240,.18);color:var(--blue)}.ev.x{text-decoration:line-through;opacity:.5}
@media(max-width:700px){.cd{min-height:60px;padding:4px}.ev{font-size:10px;padding:1px 3px}}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .15s}.kpi.click:hover{border-color:var(--acc,#8fe3d3);transform:translateY(-2px)}.kpi b{display:block;font-size:32px;font-weight:600;line-height:1.1}
.kpi span{color:var(--ink2);font-size:13px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{color:var(--ink2);font-size:13px;line-height:1.5}
.banner{border:1px dashed rgba(242,200,121,.5);color:var(--warn);background:rgba(242,200,121,.07);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:12px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--ink2);margin:2px 4px 2px 0;white-space:nowrap}
.chip.a{color:var(--accent);border-color:rgba(143,224,210,.45)}
.chip.w{color:var(--warn);border-color:rgba(242,200,121,.5)}
.chip.b{color:var(--blue);border-color:rgba(127,180,240,.5)}
.chip.d{color:var(--danger);border-color:rgba(240,138,122,.5)}
.chip.v{color:var(--violet);border-color:rgba(196,166,234,.5)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:8px 16px;color:var(--ink2)}.seg button.sel{background:var(--accent);color:#04131D;font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--ink2)}
.empty{padding:26px;text-align:center;color:var(--ink2)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.col h3{font-size:15px;margin-bottom:4px}
.col .sub{color:var(--ink2);font-size:12px;margin-bottom:12px}
.col.f{border-top:3px solid var(--accent)}.col.l{border-top:3px solid var(--warn)}.col.x{border-top:3px solid var(--danger)}
.item{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.item small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.login{max-width:380px;margin:12vh auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:30px 26px}
.login h1{font-size:22px;margin-bottom:6px}.login p{color:var(--ink2);margin:0 0 18px}
.login .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.login label{display:block;font-size:12px;color:var(--ink2);margin:12px 0 6px}
.login .btn{width:100%;margin-top:16px;padding:13px}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mdl .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.mdl label{display:block;font-size:12px;color:var(--ink2);margin:12px 0 6px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sim .f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{display:flex;flex-direction:column;gap:2px}
.res div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.res .tot{font-size:20px;font-weight:600;border-bottom:0;padding-top:14px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:10px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;z-index:70}
#toast.on{opacity:1}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .nav{margin-top:0;flex-direction:row;flex-wrap:wrap}.sidefoot{margin-top:0}
  .main{padding:20px 16px 60px}.kpis{grid-template-columns:1fr 1fr}.grid2,.cols3,.sim{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
const SUPA_URL='https://kiqumfsqcaukxazobszm.supabase.co',SUPA_KEY='sb_publishable_9YiJUA45r62HfT5KTidEdw_N0QICtoC';
const sb=window.supabase?window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}}):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={ofilter:'to_contact',msg:'Ciao {nome}, qui Blue World Freediving. Stiamo programmando i prossimi corsi: ci dici che brevetto hai (agenzia e livello)? Così sappiamo cosa proporti. Grazie!',stage:'boot',view:'home',err:'',email:'',org:null,role:null,people:[],certs:[],courses:[],interests:[],acts:[],hide:false,pfilter:'athlete',q:'',open:null};
const SOURCE_NOTE='Brevetti dichiarati nel sondaggio WhatsApp del 27/10/2026';
const LADDERS=[['wave1','wave2','wave3'],['aida1','aida2','aida3','aida4'],['aa_open','aa_adv','aa_deep']];
const STAT_NEXT={interested:'contacted',contacted:'booked',booked:'purchased',purchased:'interested'};
const STAT_LAB={interested:'Interessato',contacted:'Contattato',booked:'Prenotato',purchased:'Acquistato'};
const STAT_CLS={interested:'',contacted:'b',booked:'a',purchased:'v'};
const isAdmin=()=>S.role==='admin';

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function nm(p){const n=p.full_name||'';if(!S.hide)return n;const w=n.split(' ');return w.length>1?w[0]+' '+w.slice(1).map(x=>x[0]||'').join('')+'.':n}
function certRank(c){const l=((c.level_name||'')+' '+(c.didactic||'')).toLowerCase();
  if(/course director/.test(l))return 95;if(/trainer/.test(l))return 90;if(/master instructor/.test(l))return 80;
  if(/assistant|aiuto/.test(l))return 55;if(/instructor|istruttore/.test(l))return 70;
  if(/master/.test(l))return 45;if(/deep/.test(l))return 40;if(/advanced|avanzato/.test(l))return 30;if(/open/.test(l))return 15;
  if(/safety/.test(l))return 12;const m=l.match(/(\d)/);if(m)return 10*+m[1];if(/intermedi/.test(l))return 20;return 10}
function topCert(pid){const cs=S.certs.filter(c=>c.person_id===pid);if(!cs.length)return null;return cs.sort((a,b)=>certRank(b)-certRank(a))[0]}
function certLabel(c){if(!c)return '';const a=c.agency||'',l=c.level_name||'';return esc(l.toLowerCase().startsWith(a.toLowerCase())?l:(a+' '+l).trim())}
const euro=c=>c==null?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(c/100);
const eur0=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);

/* ---------- accesso ---------- */
async function init(){
  if(!sb){S.stage='login';S.err='Serve connessione per accedere.';return render()}
  const {data}=await sb.auth.getSession();
  if(data.session?.user&&!data.session.user.is_anonymous){await loadCenter()}else S.stage='login';
  render();
}
async function sendCode(){
  const email=$('#em').value.trim();if(!email)return;S.email=email;S.err='';
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  if(error)S.err=error.message.includes('not allowed')||error.message.includes('Signups')?'Questo indirizzo non risulta abilitato.':error.message;else S.stage='code';
  render()
}
let cdT=null;
async function resendCode(){if(S.cd>0)return;S.err='';const {error}=await sb.auth.signInWithOtp({email:S.email,options:{shouldCreateUser:true}});
  S.err=error?(/rate|seconds|limit/i.test(error.message)?'Troppe richieste ravvicinate: attendi un minuto o accedi con la password.':error.message):'Nuovo codice inviato. Controlla anche lo spam.';
  S.cd=error?0:45;clearInterval(cdT);cdT=setInterval(()=>{S.cd--;if(S.cd<=0){S.cd=0;clearInterval(cdT)}const b=$('#rs');if(b){b.disabled=S.cd>0;b.textContent=S.cd>0?'Reinvia codice ('+S.cd+'s)':'Reinvia codice'}},1000);render()}
async function pwLogin(){const email=$('#em').value.trim(),pw=$('#pw').value;if(!email||!pw)return;S.email=email;S.err='';
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){S.err='Email o password non corretti.';return render()}
  await loadCenter();render()}
function setPwModal(){modal(`<h3>Imposta password</h3><p class="note" style="margin:4px 0 8px">Ti permette di entrare anche quando l'email con il codice non arriva.</p><label>Nuova password (minimo 8 caratteri)</label><input id="np" type="password" autocomplete="new-password"><div class="row" style="margin-top:16px"><button class="btn" onclick="savePw()">Salva</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`)}
async function savePw(){const p=$('#np').value;if(p.length<8)return toast('Minimo 8 caratteri');const {error}=await sb.auth.updateUser({password:p});if(error)return toast('Non riuscito: '+error.message);closeModal();toast('Password impostata')}
async function verify(){
  const token=$('#cd').value.trim();S.err='';
  const {error}=await sb.auth.verifyOtp({email:S.email,token,type:'email'});
  if(error){S.err='Codice non valido o scaduto.';return render()}
  await loadCenter();render()
}
async function logout(){await sb.auth.signOut();Object.assign(S,{stage:'login',people:[],certs:[],courses:[],interests:[],acts:[],org:null});render()}
async function loadCenter(){
  const {data}=await sb.rpc('my_centers');
  const cs=(data||[]).filter(c=>c.status!=='left'&&['admin','instructor'].includes(c.role));
  if(!cs.length){S.stage='nostaff';return}
  S.org=cs[0];S.role=cs[0].role;S.stage='app';await loadData()
}
async function loadData(){
  const o=S.org.org_id;
  const [p,c,k,i,a]=await Promise.all([
    sb.from('people').select('*').eq('org_id',o).order('full_name'),
    sb.from('person_certs').select('*'),
    sb.from('course_types').select('*').eq('org_id',o).order('sort'),
    sb.from('interests').select('*').eq('org_id',o),
    sb.rpc('list_activities',{p_org:o,p_from:new Date(Date.now()-30*864e5).toISOString(),p_days:150})
  ]);
  S.people=p.data||[];S.certs=c.data||[];S.courses=k.data||[];S.interests=(i.data||[]).filter(x=>!String(x.source||'').startsWith('SCARTATO'));S.acts=Array.isArray(a.data)?a.data:[];
  await loadOpts();
  S.loadErr=[p,c,i].find(r=>r.error)?.error?.message||''
}

/* ---------- calcoli ---------- */
function oppRows(){
  const byId=Object.fromEntries(S.courses.map(c=>[c.id,c]));
  const held={};S.certs.forEach(c=>{const k=byId[c.course_type_id]?.code;if(k)(held[c.person_id]=held[c.person_id]||new Set()).add(k)});
  return S.courses.map(c=>{
    const iv=S.interests.filter(x=>x.course_type_id===c.id);
    const holders=S.people.filter(p=>held[p.id]?.has(c.code));
    let eligible=[];const lad=LADDERS.find(l=>l.includes(c.code));
    if(lad){const idx=lad.indexOf(c.code);if(idx>0){
      eligible=S.people.filter(p=>{const h=held[p.id];if(!h||h.has(c.code))return false;
        let top=-1;lad.forEach((k,i)=>{if(h.has(k))top=i});return top===idx-1&&!lad.slice(idx+1).some(k=>h.has(k))})}}
    const n=iv.length,booked=iv.filter(x=>x.status==='booked'||x.status==='purchased').length,contacted=iv.filter(x=>x.status!=='interested').length;
    const minP=c.min_participants||4,pool=new Set([...eligible.map(p=>p.id),...iv.map(x=>x.person_id)]).size;
    let st='—',cl='';
    if(pool>=minP){st='Bacino sufficiente';cl='a'}else if(pool>=Math.ceil(minP/2)){st='Da promuovere';cl='w'}else if(pool>=1){st='Bacino ridotto';cl=''}
    return {c,iv,holders,eligible,n,booked,contacted,minP,pool,st,cl}
  }).sort((a,b)=>b.pool-a.pool||b.holders.length-a.holders.length||a.c.sort-b.c.sort)
}
const nInstr=()=>S.people.filter(p=>p.role==='instructor').length;

/* ---------- viste ---------- */
function loginView(){
  const code=S.stage==='code',cd=S.cd||0;
  return `<div class="login"><img class="lg" src="icons/blueworld-logo.png?v=2" alt="Blue World Freediving"><h1>Dashboard</h1><p>Accesso riservato a gestori e istruttori.</p>
  ${code?`<label>Codice ricevuto per email</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" autofocus onkeydown="if(event.key==='Enter')verify()"><button class="btn" onclick="verify()">Entra</button>
    <button class="btn ghost" id="rs" style="margin-top:8px" ${cd>0?'disabled':''} onclick="resendCode()">${cd>0?'Reinvia codice ('+cd+'s)':'Reinvia codice'}</button>
    <button class="btn ghost" style="margin-top:8px" onclick="S.stage='login';S.err='';render()">Cambia email o usa la password</button>`
        :`<label>Email</label><input id="em" type="email" autocomplete="email" autofocus value="${esc(S.email)}">
    <label>Password (se l'hai impostata)</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')pwLogin()">
    <button class="btn" onclick="pwLogin()">Entra con password</button>
    <button class="btn ghost" style="margin-top:8px" onclick="sendCode()">Ricevi un codice via email</button>`}
  <div class="err">${esc(S.err)}</div></div>`
}
function nostaffView(){return `<div class="login"><h1>Accesso non abilitato</h1><p>Questo account non ha un ruolo di gestore o istruttore in un centro.</p><button class="btn ghost" onclick="logout()">Esci</button></div>`}

const VIEWS=[['home','Panoramica'],['people','Persone'],['out','Da sollecitare'],['opp','Opportunità'],['sim','Simulatore corso'],['cal','Calendario'],['map','Mappa funzioni']];
function shell(inner){
  return `<div class="app"><aside class="side"><div class="brand"><img src="icons/blueworld-logo.png?v=2" alt="Blue World Freediving"><small>Dashboard</small></div>
  <nav class="nav">${VIEWS.filter(v=>isAdmin()||!['sim'].includes(v[0])).map(v=>`<button class="${S.view===v[0]?'sel':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join('')}</nav>
  <div class="sidefoot"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" style="width:auto" ${S.hide?'checked':''} onchange="S.hide=this.checked;render()">Nascondi cognomi</label>
  <span>${esc(isAdmin()?'Gestore':'Istruttore')}</span><button onclick="setPwModal()">Imposta password</button><button onclick="logout()">Esci</button></div></aside>
  <main class="main">${S.loadErr?`<div class="banner">Alcuni dati non sono stati caricati: ${esc(S.loadErr)}</div>`:''}${inner}</main></div>`
}
function go(v){S.view=v;S.open=null;render()}

function homeView(){
  const ath=S.people.filter(p=>p.role==='athlete').length,ins=nInstr();
  const rows=oppRows(),pool=rows.filter(r=>r.pool>0&&r.eligible.length+r.iv.length>0);
  const noCert=S.people.filter(p=>!S.certs.some(c=>c.person_id===p.id)).length;
  const up=S.acts.filter(a=>new Date(a.starts_at)>=new Date()&&a.status!=='cancelled').length;
  return `<div class="top"><div><h1>Panoramica</h1><p>Stato del centro e opportunità di programmazione.</p></div></div>
  <div class="kpis"><div class="kpi click" onclick="S.pfilter='athlete';go('people')"><b>${ath}</b><span>Atleti in anagrafica</span></div><div class="kpi click" onclick="S.pfilter='instructor';go('people')"><b>${ins}</b><span>Istruttori</span></div>
  <div class="kpi click" onclick="S.pfilter='athlete';go('people')"><b>${S.certs.length}</b><span>Brevetti registrati</span></div><div class="kpi click" onclick="go('cal')"><b>${up}</b><span>Attività in programma</span></div></div>
  <div class="grid2"><div class="panel"><h2>Bacino potenziale per corso</h2>
   ${pool.length?`<table><tbody>${pool.slice(0,5).map(r=>`<tr class="click" onclick="go('opp')"><td>${esc(r.c.name)}</td><td style="width:36%"><div class="bar"><i style="width:${Math.min(100,r.pool/Math.max(1,pool[0].pool)*100)}%"></i></div></td><td class="num">${r.pool}</td><td><span class="chip ${r.cl}">${r.st}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nessun dato sufficiente.</div>'}

function actFor(p){if(!p.instr_active)return '';const ids=new Set(S.links.filter(l=>l.person_id===p.id).map(l=>l.type_id));return S.types.filter(t=>ids.has(t.id)).map(t=>t.name).sort().join(', ')}
const SORTKEY={name:p=>(p.full_name||'').toLowerCase(),loc:p=>p.is_local===true?0:p.is_local===false?1:2,top:p=>{const t=topCert(p.id);return t?-certRank(t):1e9},oth:p=>-S.certs.filter(c=>c.person_id===p.id).length,note:p=>(p.note||'').toLowerCase()||'\uffff',act:p=>actFor(p).toLowerCase()||'\uffff'};
function sortFn(){const k=(S.sort&&S.sort.k)||'top',d=(S.sort&&S.sort.d)||1,f=SORTKEY[k];return (a,b)=>{const x=f(a),y=f(b);const c=typeof x==='number'?x-y:String(x).localeCompare(String(y),'it');return (c||SORTKEY.name(a).localeCompare(SORTKEY.name(b),'it'))*(c?d:1)}}
function setSort(k){S.sort=S.sort&&S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};render()}

async function markInterest(pid,cid){

function simView(){
  const rows=oppRows();const sel=S.simCourse||rows[0]?.c.id;const r=rows.find(x=>x.c.id===sel)||rows[0];if(!r)return `<div class="empty">Nessun corso nel catalogo.</div>`;
  const c=r.c;
  const d=S.sim&&S.sim.id===c.id?S.sim:(S.sim={id:c.id,price:c.price_cents!=null?c.price_cents/100:250,n:Math.max(r.n,c.min_participants||4),days:+(c.duration_days||2),instr:1,cpd:c.instructor_day_cents!=null?c.instructor_day_cents/100:150,other:120,example:c.price_cents==null});
  const rev=d.price*d.n,ic=d.instr*d.days*d.cpd,tot=ic+ +d.other,mg=rev-tot,inc=rev?ic/rev*100:0,be=d.price>0?Math.ceil(tot/d.price):'—';
  const f=(k,l,st='1')=>`<div><label class="muted" style="font-size:12px;display:block;margin-bottom:5px">${l}</label><input type="number" step="${st}" min="0" value="${d[k]}" oninput="S.sim.${k}=+this.value;paintSim()"></div>`;
  return `<div class="top"><div><h1>Simulatore corso</h1><p>Ricavi, costo istruttori e margine previsto per un corso.</p></div>
  <select style="max-width:300px" onchange="S.simCourse=this.value;S.sim=null;render()">${rows.map(x=>`<option value="${x.c.id}" ${x.c.id===c.id?'selected':''}>${esc(x.c.name)} · ${x.n} voti</option>`).join('')}</select></div>
  ${d.example?'<div class="banner">Valori di esempio: sostituiscili con i dati reali e salvali nel catalogo.</div>':''}
  <div class="sim"><div class="panel"><h2>Parametri</h2><div class="f">${f('price','Prezzo per partecipante (€)')}${f('n','Partecipanti')}${f('days','Giornate','0.5')}${f('instr','Istruttori per giornata')}${f('cpd','Compenso istruttore per giornata (€)')}${f('other','Altri costi diretti (€)')}</div>
   <button class="btn" style="margin-top:16px" onclick="saveSim()">Salva nel catalogo</button><p class="note">Il compenso e gli altri costi sono ipotesi di lavoro, non tariffe ufficiali.</p></div>
  <div class="panel"><h2>Risultato</h2><div class="res" id="simres">${simRes(rev,ic,tot,mg,inc,be)}</div></div></div>`
}
function simRes(rev,ic,tot,mg,inc,be){
  const band=inc>=25&&inc<=35;
  return `<div><span>Ricavi previsti</span><b>${eur0(rev)}</b></div><div><span>Costo istruttori</span><b>${eur0(ic)}</b></div><div><span>Altri costi diretti</span><b>${eur0(tot-ic)}</b></div>
  <div><span>Incidenza istruttori sui ricavi</span><b><span class="chip ${band?'a':'w'}">${inc.toFixed(0)}%</span></b></div><div><span>Partecipanti minimi per pareggio</span><b>${be}</b></div>
  <div class="tot"><span>Margine di contribuzione</span><b style="color:${mg>=0?'var(--accent)':'var(--danger)'}">${eur0(mg)}</b></div>
  <p class="note" style="margin:8px 0 0">Fascia di riferimento ipotizzata per gli istruttori: 25–35% dei ricavi.</p>`
}
function paintSim(){const d=S.sim,rev=d.price*d.n,ic=d.instr*d.days*d.cpd,tot=ic+ +d.other;$('#simres').innerHTML=simRes(rev,ic,tot,rev-tot,rev?ic/rev*100:0,d.price>0?Math.ceil(tot/d.price):'—')}
async function saveSim(){
  const d=S.sim;const {error}=await sb.from('course_types').update({price_cents:Math.round(d.price*100),duration_days:d.days,min_participants:null,instructor_day_cents:Math.round(d.cpd*100)}).eq('id',d.id);
  if(error)return toast('Non riuscito: '+error.message);const c=S.courses.find(x=>x.id===d.id);Object.assign(c,{price_cents:Math.round(d.price*100),duration_days:d.days,instructor_day_cents:Math.round(d.cpd*100)});d.example=false;toast('Salvato nel catalogo');render()
}

  return 'https://wa.me/'+d+'?text='+encodeURIComponent(t)
}

function optCur(f,base){const o=S.opts[f].find(x=>x.base===base);return o?o.label:''}

function optChange(f,id){const sel=$('#'+id);if(sel.value!=='__new')return;sel.value='';$('#'+id+'_x').innerHTML=`<div class="row" style="flex-wrap:nowrap;gap:8px;margin-top:8px"><input id="${id}_n" placeholder="Nuova voce" onkeydown="if(event.key==='Enter')optAdd('${f}','${id}')">${BASES[f]?`<select id="${id}_b" title="Funziona come">${BASES[f].map(b=>`<option value="${b[0]}">come: ${b[1]}</option>`).join('')}</select>`:''}<button class="btn" type="button" onclick="optAdd('${f}','${id}')">Aggiungi</button></div>`;$('#'+id+'_n').focus()}
async function optAdd(f,id){const v=$('#'+id+'_n').value.trim();if(!v)return;

function optList(f,id){const box=$('#'+id+'_x');box.dataset.m='1';
  box.innerHTML=`<div class="panel" style="padding:8px 12px;margin-top:8px">${S.opts[f].length?S.opts[f].map(x=>`<div class="row" style="flex-wrap:nowrap;gap:6px;padding:4px 0;align-items:center"><span style="flex:1">${esc(x.label)}${x.base?` <small class="muted">· come ${esc(baseLabel(f,x.base))}</small>`:''}</span><button class="btn ghost" type="button" style="padding:3px 10px" onclick="optRename('${x.id}','${f}','${id}')">Rinomina</button><button class="btn ghost" type="button" style="padding:3px 10px;color:#ff8a8a" onclick="optDel('${x.id}','${f}','${id}')">Elimina</button></div>`).join(''):'<div class="muted" style="font-size:13px">Nessuna voce. Scegli "Nuova voce" nel menu.</div>'}</div>`}
async function optRename(oid,f,id){const o=S.opts[f].find(x=>x.id===oid);const v=prompt('Nuovo nome:',o.label);if(!v||!v.trim()||v.trim()===o.label)return;
  const {error}=await sb.from('activity_options').update({label:v.trim()}).eq('id',oid);if(error)return toast('Non riuscito: '+error.message);const cur=$('#'+id).value;await loadOpts();$('#'+id).innerHTML=optSel(f,cur===o.label?v.trim():cur);optList(f,id)}
async function optDel(oid,f,id){const o=S.opts[f].find(x=>x.id===oid);if(!confirm('Togliere "'+o.label+'" dall\'elenco? Le attività già create non cambiano.'))return;
  const {error}=await sb.from('activity_options').delete().eq('id',oid);if(error)return toast('Non riuscito: '+error.message);const cur=$('#'+id).value;await loadOpts();$('#'+id).innerHTML=optSel(f,cur===o.label?'':cur);optList(f,id)}
function typeFor(a){if(!a)return S.types[0];return S.types.find(t=>t.id===a.type_id)||S.types.find(t=>t.name===a.title)||S.types.find(t=>t.kind===a.kind&&t.env===a.location_type)||S.types[0]}
function typePick(){const t=S.types.find(x=>x.id===$('#aty').value);if(!t)return;const prev=S.types.find(x=>x.id===S._prevT);const ti=$('#at');if(!ti.value||(prev&&ti.value===prev.name))ti.value=t.name;S._prevT=t.id;
  $('#ac').value=t.capacity;const st=new Date($('#as').value);if(!isNaN(st))$('#ae2').value=dl(new Date(st.getTime()+t.duration_min*6e4));refreshInstr()}
function actModal(id,day){const a=id?S.acts.find(x=>x.id===id):null;
  if(!S.types.length){modal(`<h3>Nuova attività</h3><p class="note">Prima crea almeno un tipo di attività.</p><div class="row" style="margin-top:14px"><button class="btn" onclick="typesModal()">Tipi di attività</button><button class="btn ghost" onclick="closeModal()">Chiudi</button></div>`);return}
  const ty=typeFor(a);S._prevT=ty.id;
  const st=a?new Date(a.starts_at):(day?new Date(day+'T09:00'):new Date(Date.now()+864e5));if(!a){st.setHours(9,0,0,0)}const en=a?new Date(a.ends_at):new Date(st.getTime()+ty.duration_min*6e4);
  const seats=[...Array(30).keys()].map(n=>n+1);
  modal(`<h3>${a?'Modifica attività':'Nuova attività'}</h3>
  <label>Tipo di attività</label><div class="row" style="flex-wrap:nowrap;gap:8px"><select id="aty" onchange="typePick()">${S.types.map(t=>`<option value="${t.id}"${t.id===ty.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn ghost" type="button" style="padding:0 14px" title="Gestisci i tipi di attività" onclick="typesModal()">✎</button></div>
  <label>Titolo</label><input id="at" value="${esc(a?a.title:ty.name)}">
  ${optField('place','ap','Luogo',a?a.place||'':'')}
  <div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><label>Inizio</label><input id="as" type="datetime-local" value="${dl(st)}" onchange="${a?'':'typePick()'}"></div><div style="flex:1;min-width:0"><label>Fine</label><input id="ae2" type="datetime-local" value="${dl(en)}"></div></div>
  <label>Istruttore <span class="muted">(si può assegnare anche dopo)</span></label><select id="ai"><option value="">— Da assegnare —</option>${instrOptions(a?a.instructor_person_id:'',ty.id)}</select><div id="ai_h" class="note" style="margin-top:4px"></div>
  <label>Posti</label><select id="ac">${seats.map(n=>`<option${n===(a?a.capacity:ty.capacity)?' selected':''}>${n}</option>`).join('')}</select>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveActD('${id||''}')">Salva</button><button class="btn ghost" onclick="closeModal()">Annulla</button>${a?`<button class="btn ghost" style="margin-left:auto;color:#ff8a8a" onclick="cancelActD('${id}')">Annulla attività</button>`:''}</div>`);refreshInstr()}
function typesModal(){modal(`<h3>Tipi di attività</h3><p class="note" style="margin:4px 0 10px">Elenco unico: da qui dipendono il calendario e le specialità degli istruttori.</p>
  ${S.types.map(t=>`<div class="item" style="display:flex;gap:8px;align-items:center;justify-content:space-between"><span><b>${esc(t.name)}</b> <small class="muted">· ${esc(kindLab(t.kind))} · ${esc(envLab(t.env))} · ${t.capacity} posti · ${durLab(t.duration_min)}</small></span><span style="white-space:nowrap"><button class="btn ghost" style="padding:4px 10px" onclick="typeForm('${t.id}')">Modifica</button> <button class="btn ghost" style="padding:4px 10px" onclick="delType('${t.id}')">Elimina</button></span></div>`).join('')||'<div class="muted">Nessun tipo.</div>'}
  <div class="row" style="margin-top:16px"><button class="btn" onclick="typeForm()">＋ Nuovo tipo</button><button class="btn ghost" onclick="closeModal()">Chiudi</button></div>`)}
const KL={training:'Allenamento',course:'Corso',dry:'Apnea a secco'},EL={sea:'Mare',pool:'Piscina',dry:'A secco'};
function kindLab(k){return KL[k]||k}function envLab(e){return EL[e]||e}function durLab(m){return m%60?m+' min':(m/60)+' h'}
function typeForm(id){const t=id?S.types.find(x=>x.id===id):{name:'',kind:'training',env:'sea',capacity:6,duration_min:120};
  modal(`<h3>${id?'Modifica tipo':'Nuovo tipo di attività'}</h3><label>Nome</label><input id="tn" value="${esc(t.name)}">
  <div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><label>Si comporta come</label><select id="tk">${Object.entries(KL).map(([k,l])=>`<option value="${k}"${t.kind===k?' selected':''}>${l}</option>`).join('')}</select></div><div style="flex:1;min-width:0"><label>Ambiente</label><select id="te">${Object.entries(EL).map(([k,l])=>`<option value="${k}"${t.env===k?' selected':''}>${l}</option>`).join('')}</select></div></div>
  <div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><label>Posti predefiniti</label><input id="tc" type="number" min="1" value="${t.capacity}"></div><div style="flex:1;min-width:0"><label>Durata (minuti)</label><input id="td" type="number" min="15" step="15" value="${t.duration_min}"></div></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveType('${id||''}')">Salva</button><button class="btn ghost" onclick="typesModal()">Annulla</button></div>`)}
async function saveType(id){const n=$('#tn').value.trim();if(!n)return toast('Scrivi un nome');const rec={name:n,kind:$('#tk').value,env:$('#te').value,capacity:+$('#tc').value||1,duration_min:+$('#td').value||60};
  const q=id?sb.from('activity_types').update(rec).eq('id',id).select().single():sb.from('activity_types').insert({...rec,org_id:S.org.org_id}).select().single();
  const {data,error}=await q;if(error)return toast(/duplicate|unique/i.test(error.message)?'Esiste già un tipo con questo nome':'Non riuscito: '+error.message);
  if(id)Object.assign(S.types.find(x=>x.id===id),data);else S.types.push(data);S.types.sort((a,b)=>a.name.localeCompare(b.name));typesModal();toast('Tipo salvato')}
async function delType(id){const t=S.types.find(x=>x.id===id);const used=S.acts.filter(a=>a.type_id===id).length,inst=S.links.filter(l=>l.type_id===id).length;
  if(!confirm('Eliminare "'+t.name+'"?'+(inst?'\nVerrà tolto da '+inst+' istruttori.':'')+(used?'\nLe '+used+' attività già create restano ma non avranno più il tipo.':'')))return;
  const {error}=await sb.from('activity_types').delete().eq('id',id);if(error)return toast('Non riuscito: '+error.message);
  S.types=S.types.filter(x=>x.id!==id);S.links=S.links.filter(l=>l.type_id!==id);typesModal();toast('Tipo eliminato')}
async function saveActD(id){const ty=S.types.find(x=>x.id===$('#aty').value);if(!ty)return toast('Scegli il tipo di attività');const t=$('#at').value.trim();if(!t)return toast('Scrivi un titolo');const s=new Date($('#as').value),e=new Date($('#ae2').value);if(isNaN(s)||isNaN(e)||e<=s)return toast('Controlla data e orari');
  const rec={type_id:ty.id,kind:ty.kind,location_type:ty.env,title:t,place:($('#ap').value==='__new'?'':$('#ap').value.trim()),starts_at:s.toISOString(),ends_at:e.toISOString(),capacity:+$('#ac').value||1,instructor_person_id:$('#ai').value||null};
  const q=id?sb.from('activities').update(rec).eq('id',id):sb.from('activities').insert({...rec,org_id:S.org.org_id,min_rank:0});
  const {error}=await q;if(error)return toast('Non riuscito: '+error.message);closeModal();await reloadActs();toast('Attività salvata')}
async function cancelActD(id){const why=prompt("Motivo dell'annullamento (visibile ai partecipanti):",'Condizioni meteo');if(why===null)return;
  const {error}=await sb.from('activities').update({status:'cancelled',cancel_reason:why}).eq('id',id);if(error)return toast('Non riuscito: '+error.message);closeModal();await reloadActs();toast('Attività annullata')}
function calGrid(){
  const m=S.calM||(S.calM=new Date(new Date().getFullYear(),new Date().getMonth(),1));
  const first=new Date(m.getFullYear(),m.getMonth(),1),off=(first.getDay()+6)%7,start=new Date(m.getFullYear(),m.getMonth(),1-off);
  const ad=isAdmin(),today=new Date().toDateString(),by={};
  S.acts.forEach(a=>{const k=new Date(a.starts_at).toDateString();(by[k]=by[k]||[]).push(a)});
  let cells='';for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);if(i>=35&&d.getMonth()!==m.getMonth())break;
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const ev=(by[d.toDateString()]||[]).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).map(a=>`<span class="ev ${a.kind==='course'?'c':a.kind==='dry'?'d':''} ${a.status==='cancelled'?'x':''}" onclick="event.stopPropagation();${ad?`actModal('${a.id}')`:''}" title="${esc(a.title)}">${new Date(a.starts_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})} ${esc(a.title)}${a.instructor_name?' · '+esc(String(a.instructor_name).split(' ')[0]):''}</span>`).join('');
    cells+=`<div class="cd ${d.getMonth()!==m.getMonth()?'out':''} ${d.toDateString()===today?'today':''} ${ad?'adm':''}" ${ad?`onclick="actModal(null,'${iso}')"`:''}><b>${d.getDate()}</b>${ev}</div>`}
  return `<div class="cal"><div class="calh"><button onclick="S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()-1,1);render()">←</button><h2>${m.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h2><span><button onclick="S.calM=null;render()">Oggi</button> <button onclick="S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()+1,1);render()">→</button></span></div>
  <div class="cg">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>`<div class="dw">${x}</div>`).join('')}${cells}</div>
  <div class="note" style="margin-top:10px">${ad?'Clicca un giorno per aggiungere un\'attività. ':''}<span style="color:var(--accent)">■</span> allenamento <span style="color:var(--violet)">■</span> corso <span style="color:var(--blue)">■</span> apnea a secco</div></div>`}
function calView(){
  const days={};S.acts.filter(a=>a.status!=='cancelled').forEach(a=>{const k=new Date(a.starts_at).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});(days[k]=days[k]||[]).push(a)});
  const keys=Object.keys(days);
  return `<div class="top"><div><h1>Calendario</h1><p>Attività del centro: sono le stesse che gli atleti vedono nell'app.</p></div>${isAdmin()?`<div class="row"><button class="btn ghost" onclick="typesModal()">Tipi di attività</button><button class="btn" onclick="actModal()">Nuova attività</button></div>`:''}</div>
  ${calGrid()}${keys.length?`<h2 style="margin:6px 0 10px;font-size:16px">Elenco attività</h2>`:''}
  ${keys.length?keys.map(k=>`<div class="panel"><h2 style="text-transform:capitalize">${esc(k)}</h2><table><tbody>${days[k].map(a=>`<tr ${isAdmin()?`style="cursor:pointer" onclick="actModal('${a.id}')"`:''}><td style="width:110px">${new Date(a.starts_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}–${new Date(a.ends_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(a.title)}</b><div class="muted" style="font-size:13px">${esc(a.place||'')}${a.instructor_name?' · '+esc(a.instructor_name):' · <span style="color:var(--warn)">istruttore da assegnare</span>'}</div></td><td class="num">${a.booked}/${a.capacity}${a.waitlist?` · +${a.waitlist} in attesa`:''}</td></tr>`).join('')}</tbody></table></div>`).join(''):`<div class="note">Nessuna attività in calendario: quelle che crei compaiono qui e nell'app degli atleti.</div>`}`
}

    ['Corso su più giornate con istruttori diversi','Sessioni collegate allo stesso corso'],

  ${col('x','Da escludere','Meglio altri strumenti',[
    ['Contabilità, bilancio, budget','Resta al commercialista e al gestionale amministrativo'],
    ['Separazione economica tra titolare e società','Questione amministrativa, non della dashboard'],
    ['Magazzino attrezzatura','Fuori dal perimetro'],

}

/* ---------- modali ---------- */
function modal(h){closeModal();const d=document.createElement('div');d.className='mdl';d.id='mdl';d.innerHTML=`<div class="box">${h}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeModal()});document.body.appendChild(d)}
function closeModal(){$('#mdl')?.remove()}
function normPhone(v){let d=String(v||'').trim();if(!d)return {ok:true,v:null};d=d.replace(/[^0-9+]/g,'');if(d.startsWith('00'))d='+'+d.slice(2);
  if(!d.startsWith('+'))return {ok:false,msg:'Il prefisso internazionale è obbligatorio (es. +39 per l\'Italia)'};
  if(!/^\+[0-9]{8,15}$/.test(d))return {ok:false,msg:'Numero non valido: controlla le cifre'};return {ok:true,v:d}}
const LOC_LAB={true:'Locale',false:'Non locale',null:'Da indicare'};
function locSel(id,cur){return `<select id="${id}"><option value=""${cur==null?' selected':''}>Da indicare</option><option value="1"${cur===true?' selected':''}>Locale (zona Acireale / Catania)</option><option value="0"${cur===false?' selected':''}>Non locale (viene da fuori)</option></select>`}
function locVal(id){const v=$('#'+id).value;return v===''?null:v==='1'}
async function cycleLoc(id){const p=S.people.find(x=>x.id===id);const n=p.is_local==null?true:p.is_local===true?false:null;
  const {error}=await sb.from('people').update({is_local:n}).eq('id',id);if(error)return toast('Non riuscito: '+error.message);p.is_local=n;renderKeep()}
function addPerson(){modal(`<h3>Aggiungi persona</h3><label>Nome e cognome</label><input id="pn"><label>Ruolo</label><select id="pr"><option value="athlete">Atleta</option><option value="instructor">Istruttore</option></select><label>Provenienza</label>${locSel("pl",null)}<label>Telefono (con prefisso, es. +39 333 1234567)</label><input id="pph" inputmode="tel" placeholder="+39…"><div class="row" style="margin-top:18px"><button class="btn" onclick="savePerson()">Aggiungi</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`)}
async function savePerson(){const n=$('#pn').value.trim();if(!n)return;const ph=normPhone($('#pph').value);if(!ph.ok)return toast(ph.msg);const {data,error}=await sb.from('people').insert({org_id:S.org.org_id,full_name:n,role:$('#pr').value,is_local:locVal('pl'),phone:ph.v}).select().single();if(error)return toast('Non riuscito: '+error.message);S.people.push(data);S.people.sort((a,b)=>a.full_name.localeCompare(b.full_name));closeModal();render()}

  <button class="btn ghost" type="button" style="margin-top:6px;padding:4px 12px" onclick="typesModal()">Gestisci i tipi di attività</button></div>`:''}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="savePersonEdit('${id}')">Salva anagrafica</button></div>`
  :`<h3>${esc(nm(p))}</h3><p class="note" style="margin:4px 0 12px">${p.role==='instructor'?'Istruttore':'Atleta'}${p.note?' · '+esc(p.note):''}</p>`;

  ${ad?`<label>Aggiungi brevetto</label><div class="row" style="flex-wrap:nowrap"><input id="ca" placeholder="Agenzia (es. AIDA, Molchanovs)"><input id="cl" placeholder="Livello (es. Wave 2)"></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveCert('${id}')">Aggiungi brevetto</button><button class="btn ghost" onclick="closeModal()">Chiudi</button><button class="btn ghost" style="margin-left:auto;color:#ff8a8a" onclick="delPerson('${id}')">Elimina persona</button></div>`:`<div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Chiudi</button></div>`}`)
}
async function savePersonEdit(id){const n=$('#en').value.trim();if(!n)return toast('Il nome non può essere vuoto');
  const ph=normPhone($('#ep').value);if(!ph.ok)return toast(ph.msg);const u={full_name:n,role:$('#er').value,phone:ph.v,is_local:locVal('el'),note:$('#eo').value.trim()||null};let chk=null;if($('#ia')){u.instr_active=$('#ia').checked;chk=[...document.querySelectorAll('.spc:checked')].map(x=>x.value)}
  const {data,error}=await sb.from('people').update(u).eq('id',id).select().single();if(error)return toast('Non riuscito: '+error.message);
  if(chk){const d=await sb.from('instructor_activity_types').delete().eq('person_id',id);if(d.error)return toast('Non riuscito: '+d.error.message);
    if(chk.length){const i=await sb.from('instructor_activity_types').insert(chk.map(t=>({person_id:id,type_id:t})));if(i.error)return toast('Non riuscito: '+i.error.message)}
    S.links=S.links.filter(l=>l.person_id!==id).concat(chk.map(t=>({person_id:id,type_id:t})))}
  Object.assign(S.people.find(x=>x.id===id),data);S.people.sort((a,b)=>a.full_name.localeCompare(b.full_name));render();openPerson(id);toast('Anagrafica salvata')}
async function delPerson(id){const p=S.people.find(x=>x.id===id);if(!confirm('Eliminare definitivamente '+p.full_name+' con brevetti e interessi?'))return;
  for(const t of ['person_certs','interests']){const {error}=await sb.from(t).delete().eq('person_id',id);if(error)return toast('Non riuscito ('+t+'): '+error.message)}
  const {error}=await sb.from('people').delete().eq('id',id);if(error)return toast('Non riuscito: '+error.message);
  S.people=S.people.filter(x=>x.id!==id);S.certs=S.certs.filter(c=>c.person_id!==id);if(S.interests)S.interests=S.interests.filter(i=>i.person_id!==id);closeModal();render();toast('Persona eliminata')}
function editCert(cid){const c=S.certs.find(x=>x.id===cid);const pid=c.person_id;
  modal(`<h3>Modifica brevetto</h3><label>Agenzia</label><input id="ca2" value="${esc(c.agency||'')}"><label>Livello</label><input id="cl2" value="${esc(c.level_name||'')}"><label>Data (opzionale)</label><input id="cd2" type="date" value="${esc(c.cert_date||'')}">
  <div class="row" style="margin-top:16px"><button class="btn" onclick="saveCertEdit('${cid}')">Salva</button><button class="btn ghost" onclick="openPerson('${pid}')">Annulla</button></div>`)}
async function saveCertEdit(cid){const a=$('#ca2').value.trim(),l=$('#cl2').value.trim();if(!a||!l)return toast('Indica agenzia e livello');
  const {data,error}=await sb.from('person_certs').update({agency:a,level_name:l,cert_date:$('#cd2').value||null}).eq('id',cid).select().single();if(error)return toast('Non riuscito: '+error.message);
  Object.assign(S.certs.find(x=>x.id===cid),data);render();openPerson(data.person_id);toast('Brevetto aggiornato')}
async function delCert(cid,pid){if(!confirm('Eliminare questo brevetto?'))return;
  const {error}=await sb.from('person_certs').delete().eq('id',cid);if(error)return toast('Non riuscito: '+error.message);
  S.certs=S.certs.filter(x=>x.id!==cid);render();openPerson(pid);toast('Brevetto eliminato')}
async function saveCert(id){const a=$('#ca').value.trim(),l=$('#cl').value.trim();if(!a||!l)return toast('Indica agenzia e livello');
  const {data,error}=await sb.from('person_certs').insert({person_id:id,agency:a,level_name:l}).select().single();if(error)return toast('Non riuscito: '+error.message);S.certs.push(data);render();openPerson(id);toast('Brevetto aggiunto')}

/* ---------- render ---------- */
function render(){
  const r=$('#root');
  if(S.stage==='boot'){r.innerHTML='';return}
  if(S.stage==='login'||S.stage==='code'){r.innerHTML=loginView();return}
  if(S.stage==='nostaff'){r.innerHTML=nostaffView();return}
  const v={home:homeView,people:peopleView,out:outView,opp:oppView,sim:simView,cal:calView,map:mapView}[S.view]||homeView;
  r.innerHTML=shell(v())
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if($('#cd'))verify();else if($('#em'))sendCode()}if(e.key==='Escape')closeModal()});
init();
</script>
</body>
</html>
