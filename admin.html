<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin · Breathing Coach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#061A2B;--card:#0B2A42;--fg:#E6F1F8;--mut:#9DB8CC;--acc:#4FD1C5;--warn:#F2C879}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;color:var(--acc);margin:26px 0 8px}
.mut{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.k{background:var(--card);border-radius:14px;padding:12px 14px}.k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid #16415f;text-align:left}th{color:var(--mut);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;background:var(--card);border-radius:14px;padding:10px 10px 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.bars i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}.bars small{font-size:10px;color:var(--mut);margin-top:3px}
.box{background:var(--card);border-radius:14px;padding:16px;margin-top:20px}button{background:var(--acc);color:#062A2A;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
a{color:var(--acc)}
</style></head><body><main>
<p style="margin:0 0 8px"><a href="./">← App</a></p><h1>Breathing Coach · Admin</h1><div class="mut" id="sub">Caricamento…</div>
<div id="out"></div>
<script>
const sb=window.supabase.createClient('https://kiqumfsqcaukxazobszm.supabase.co','sb_publishable_9YiJUA45r62HfT5KTidEdw_N0QICtoC',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),out=$('out');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mmss=s=>s==null?'–':`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const NAMES={breathing:'Respirazione',static:'Apnea statica'};
function box(msg){out.innerHTML=`<div class="box">${msg}</div>`}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('sub').textContent='';return box('Non sei connesso. Apri prima <a href="./">l’app</a>, accedi con il tuo account (Google o email), poi torna su questa pagina.')}
  const {data,error}=await sb.rpc('admin_overview');
  if(error){$('sub').textContent='';return box(/not authorized/.test(error.message)?'Questo account non è amministratore.':'Errore: '+esc(error.message))}
  $('sub').textContent='Aggiornato '+new Date(data.generated_at).toLocaleString('it-IT');
  const K=(v,l)=>`<div class="k"><b>${v}</b><span>${l}</span></div>`;
  const mx=Math.max(1,...data.daily.map(d=>d.sessions));
  const obj=o=>Object.entries(o||{}).map(([k,v])=>`${esc(NAMES[k]||k)}: <b>${v}</b>`).join(' · ')||'–';
  out.innerHTML=`<div class="grid">${K(data.users_total,'utenti totali')}${K(data.users_registered,'registrati')}${K(data.users_guest,'ospiti')}${data.guests_inactive!==undefined?K(data.guests_inactive,'ospiti senza allenamenti'):''}${K(data.new_7d,'nuovi (7 gg)')}${K(data.active_7d,'si sono allenati (7 gg)')}${K(data.active_30d,'si sono allenati (30 gg)')}${K(data.opened_7d,'hanno aperto l’app (7 gg)')}${K(data.sessions_total,'allenamenti totali')}${K(data.sessions_7d,'allenamenti (7 gg)')}${K(data.minutes_7d,'minuti (7 gg)')}${K(data.errors_7d,'errori (7 gg)')}</div>
  <h2>Allenamenti negli ultimi 14 giorni</h2><div class="bars">${data.daily.map(d=>`<div title="${d.day}: ${d.sessions} allenamenti, ${d.users} utenti"><i style="height:${d.sessions/mx*80}%"></i><small>${d.day.slice(8)}</small></div>`).join('')}</div>
  <h2>Per esercizio</h2><div class="mut">${obj(data.by_exercise)}</div>
  <h2>Come è andata (feedback)</h2><div class="mut">${obj({easy:data.feedback.easy,right:data.feedback.right,hard:data.feedback.hard})}</div>
  <h2>Versioni in uso (7 gg)</h2><div class="mut">${obj(data.versions)}</div>
  <h2>Ultimi allenamenti</h2><table><tr><th>Quando</th><th>Chi</th><th>Esercizio</th><th>Durata</th><th>Esito</th></tr>${data.recent.map(r=>`<tr><td>${new Date(r.started_at).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.who)}</td><td>${esc(NAMES[r.exercise_id]||r.exercise_id)}</td><td>${mmss(r.elapsed_sec)}</td><td>${esc(r.status)}${r.feedback?' · '+esc(r.feedback):''}</td></tr>`).join('')}</table>
  <h2>Ultimi iscritti</h2><table><tr><th>Quando</th><th>Chi</th><th>Tipo</th><th>Livello</th><th>Obiettivo</th>${data.guests_inactive!==undefined?'<th>Allenamenti</th><th>Versione</th><th>Ultimo accesso</th>':''}</tr>${data.recent_users.map(r=>`<tr><td>${new Date(r.created_at).toLocaleDateString('it-IT')}</td><td>${esc(r.who)}</td><td>${r.is_anonymous?'ospite':'registrato'}</td><td>${esc(r.level||'–')}</td><td>${esc(r.goal||'–')}</td>${data.guests_inactive!==undefined?`<td>${r.n_sessions||0}</td><td>${esc(r.app_version?'v'+r.app_version:'–')}</td><td>${r.last_seen?new Date(r.last_seen).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–'}</td>`:''}</tr>`).join('')}</table>${data.guests_inactive!==undefined?`<p class="tiny" style="color:var(--ink2)">Nascosti dall’elenco: ${data.guests_inactive} ospiti che non hanno mai fatto un allenamento (contati nel riquadro sopra). Registrati senza allenamenti: ${data.registered_inactive}.</p>`:''}
  <p class="mut" style="margin-top:24px"><button onclick="location.reload()">Aggiorna</button></p>`;
})();
</script></main></body></html>
